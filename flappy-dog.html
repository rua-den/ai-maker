<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flappy Dog</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#31aee9;color:#fff;font-family:"Segoe UI",system-ui,sans-serif}
  #loading{height:100%;display:grid;place-items:center;font-weight:800}
</style>

<!-- Global Vietnamese/CJK-safe font stack -->
<link rel="stylesheet" href="./assets/app-fonts.css">
</head>
<body>
<div id="loading">Loading Flappy Dog…</div>
<script>
(async () => {
  try {
    const response = await fetch('./flappy-dog-core.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    let html = await response.text();
    html = html.replace('</head>', '<style id="no-leaderboard-import">#importBtn,#importFile{display:none!important}</style>\n</head>');
    const closeScript = '</scr' + 'ipt>';
    const cleanup = '<script>(function(){const b=document.getElementById("importBtn");const f=document.getElementById("importFile");if(b)b.remove();if(f)f.remove();})();' + closeScript;
    html = html.replace('</body>', cleanup + '\n</body>');
    document.open(); document.write(html); document.close();
  } catch (error) {
    document.getElementById('loading').textContent = 'Không tải được Flappy Dog. Hãy reload trang.';
    console.error('Flappy Dog loader failed:', error);
  }
})();
</script>
</body>
</html>
