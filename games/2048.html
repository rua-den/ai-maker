<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>2048 — Rùa</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:#f7f1e8;color:#5c5148;overscroll-behavior:none}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}
.app{width:min(94vw,520px);display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.home{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;text-decoration:none;background:#8f7a66;color:#fff;font-size:20px;box-shadow:0 4px 0 #6d5c4d}
.title h1{font-size:clamp(38px,12vw,58px);line-height:.9;margin:0;font-weight:1000;color:#776e65}
.title p{margin:8px 0 0;font-size:13px;font-weight:700;opacity:.75}
.scores{display:flex;gap:7px}
.scoreBox{min-width:78px;background:#bbada0;color:#fff;border-radius:9px;padding:7px 10px;text-align:center;font-weight:900}
.scoreBox small{display:block;font-size:10px;letter-spacing:.7px;opacity:.85}
.scoreBox strong{display:block;font-size:19px;margin-top:2px}
.score-pop{animation:scorePop .16s ease-out}
.actions{display:flex;gap:8px}
.btn{border:0;border-radius:9px;padding:10px 14px;background:#8f7a66;color:#fff;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 3px 0 #6d5c4d;transition:transform .1s ease,box-shadow .1s ease,filter .12s ease}
.btn:active,.home:active{transform:translateY(2px)}
.btn:hover,.home:hover{filter:brightness(1.035)}
.boardWrap{position:relative}
.board{position:relative;width:100%;aspect-ratio:1;background:#bbada0;border-radius:12px;padding:10px;touch-action:none;user-select:none;overflow:hidden}
.gridBg{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px}
.bgCell{border-radius:9px;background:#cdc1b4}
.tileLayer{position:absolute;inset:0;pointer-events:none}
.tile{position:absolute;border-radius:9px;display:grid;place-items:center;color:#776e65;font-size:clamp(25px,8vw,42px);font-weight:1000;transition:transform 125ms cubic-bezier(.2,.72,.25,1);will-change:transform;z-index:2;backface-visibility:hidden}
.tile[data-v="2"]{background:#eee4da}.tile[data-v="4"]{background:#ede0c8}.tile[data-v="8"]{background:#f2b179;color:#f9f6f2}.tile[data-v="16"]{background:#f59563;color:#f9f6f2}.tile[data-v="32"]{background:#f67c5f;color:#f9f6f2}.tile[data-v="64"]{background:#f65e3b;color:#f9f6f2}.tile[data-v="128"]{background:#edcf72;color:#f9f6f2;font-size:clamp(22px,7vw,36px)}.tile[data-v="256"]{background:#edcc61;color:#f9f6f2;font-size:clamp(22px,7vw,36px)}.tile[data-v="512"]{background:#edc850;color:#f9f6f2;font-size:clamp(22px,7vw,36px)}.tile[data-v="1024"]{background:#edc53f;color:#f9f6f2;font-size:clamp(18px,6vw,31px)}.tile[data-v="2048"]{background:#edc22e;color:#f9f6f2;font-size:clamp(18px,6vw,31px);box-shadow:0 0 24px rgba(237,194,46,.55)}.tile.big{background:#3c3a32;color:#f9f6f2;font-size:clamp(16px,5vw,27px)}
.tile.spawn{animation:spawn .16s cubic-bezier(.2,.9,.25,1.3)}
.tile.merge{animation:mergePop .18s cubic-bezier(.2,.9,.25,1.3)}
.cover{position:absolute;inset:0;border-radius:12px;background:rgba(238,228,218,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;z-index:8}
.cover.show{display:flex}
.cover h2{margin:0;font-size:32px;font-weight:1000;color:#776e65}
.cover p{margin:0;font-weight:800}
.panel{background:#fff;border-radius:12px;padding:13px 14px;box-shadow:0 8px 24px rgba(95,73,51,.1)}
.nameRow{display:flex;gap:8px}
.nameRow input{flex:1;min-width:0;border:2px solid #d8cec3;border-radius:9px;padding:9px 11px;font:inherit;font-weight:800;color:#5c5148;outline:none}
.nameRow input:focus{border-color:#f2b179}
.leaderTitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.leaderTitle strong{font-size:15px}.leaderTitle span{font-size:11px;opacity:.65;font-weight:700}
.leaderboard{display:flex;flex-direction:column;gap:5px;max-height:170px;overflow:auto}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;border-radius:8px;padding:6px 8px;background:#f7f2ec;font-size:13px;font-weight:800}
.row.me{background:#fff0c8;outline:1px solid #edc22e}
.empty{text-align:center;padding:10px;font-size:12px;opacity:.6;font-weight:700}
.hint{text-align:center;font-size:12px;line-height:1.5;font-weight:700;opacity:.68;padding-bottom:env(safe-area-inset-bottom)}
@keyframes spawn{0%{transform:scale(.65);opacity:.25}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mergePop{0%{transform:scale(.88)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes scorePop{0%{transform:scale(.9);opacity:.7}55%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@media(max-width:430px){body{padding:12px}.app{gap:11px}.title p{display:none}.scoreBox{min-width:66px;padding:6px 7px}.scoreBox strong{font-size:17px}.board{padding:8px}.gridBg{inset:8px;gap:8px}.panel{padding:11px}.actions .btn{flex:1}.actions{width:100%}}
@media(prefers-reduced-motion:reduce){.tile{transition:none}.tile.spawn,.tile.merge,.score-pop{animation:none!important}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><a class="home" href="../index.html">🐢</a><div class="title"><h1>2048</h1><p>Ghép các ô giống nhau để lên 2048.</p></div></div>
    <div class="scores"><div class="scoreBox"><small>ĐIỂM</small><strong id="score">0</strong></div><div class="scoreBox"><small>BEST</small><strong id="best">0</strong></div></div>
  </div>
  <div class="actions"><button class="btn" id="newBtn">↻ Ván mới</button><button class="btn" id="undoBtn">↩ Undo</button></div>
  <div class="boardWrap">
    <div class="board" id="board">
      <div class="gridBg" id="gridBg"></div>
      <div class="tileLayer" id="tileLayer"></div>
    </div>
    <div class="cover" id="cover"><h2 id="coverTitle">Game Over</h2><p id="coverText"></p><button class="btn" id="againBtn">Chơi lại</button></div>
  </div>
  <div class="panel"><div class="nameRow"><input id="nameInput" maxlength="14" autocomplete="off" placeholder="Tên của bạn"><button class="btn" id="saveNameBtn">Lưu tên</button></div></div>
  <div class="panel"><div class="leaderTitle"><strong>🏆 Top 10</strong><span>Firebase leaderboard</span></div><div class="leaderboard" id="leaderboard"></div></div>
  <div class="hint">PC: dùng phím mũi tên / WASD · Điện thoại: vuốt lên, xuống, trái, phải.</div>
</div>
<script>
const boardEl=document.getElementById('board'),gridBg=document.getElementById('gridBg'),tileLayer=document.getElementById('tileLayer'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),cover=document.getElementById('cover'),coverTitle=document.getElementById('coverTitle'),coverText=document.getElementById('coverText'),nameInput=document.getElementById('nameInput'),leaderboardEl=document.getElementById('leaderboard');
const GAME_ID='2048',NAME_KEY='playerName',BEST_KEY='best_2048',SAVE_KEY='game_2048',MOVE_MS=125;
const slots=[];
for(let i=0;i<16;i++){const c=document.createElement('div');c.className='bgCell';gridBg.appendChild(c);slots.push(c)}
let nextId=1,tiles=Array(16).fill(null),score=0,previous=null,wonShown=false,gameOver=false,locked=false,leaderboard=[],submitted=false;
let playerName='';try{playerName=localStorage.getItem(NAME_KEY)||'';nameInput.value=playerName;bestEl.textContent=localStorage.getItem(BEST_KEY)||'0'}catch(e){}
let fbRef=null;try{if(window.firebase&&typeof firebaseConfig!=='undefined'){if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);fbRef=firebase.database().ref('leaderboards/'+GAME_ID)}}catch(e){console.warn('Firebase unavailable',e)}

function tileValues(){return tiles.map(t=>t?t.value:0)}
function fromValues(values){return values.map(v=>Number(v)>0?{id:nextId++,value:Number(v)}:null)}
function slotBox(i){const sr=slots[i].getBoundingClientRect(),br=boardEl.getBoundingClientRect();return{left:sr.left-br.left,top:sr.top-br.top,width:sr.width,height:sr.height}}
function styleTile(el,index){const b=slotBox(index);el.style.left=b.left+'px';el.style.top=b.top+'px';el.style.width=b.width+'px';el.style.height=b.height+'px'}
function makeTileEl(tile,index,cls=''){const el=document.createElement('div');el.className='tile'+(tile.value>2048?' big':'')+(cls?' '+cls:'');el.dataset.id=tile.id;el.dataset.v=tile.value;el.textContent=tile.value;styleTile(el,index);return el}
function renderBoard(spawnId=null,mergeIds=new Set()){
  tileLayer.innerHTML='';
  tiles.forEach((t,i)=>{if(!t)return;const cls=t.id===spawnId?'spawn':mergeIds.has(t.id)?'merge':'';tileLayer.appendChild(makeTileEl(t,i,cls))});
  scoreEl.textContent=score;
  const best=Math.max(Number(bestEl.textContent)||0,score);bestEl.textContent=best;
  try{localStorage.setItem(BEST_KEY,String(best));localStorage.setItem(SAVE_KEY,JSON.stringify({values:tileValues(),score,wonShown,gameOver}))}catch(e){}
}
function addRandomTile(){
  const empty=[];tiles.forEach((t,i)=>{if(!t)empty.push(i)});if(!empty.length)return null;
  const index=empty[Math.floor(Math.random()*empty.length)],tile={id:nextId++,value:Math.random()<.9?2:4};tiles[index]=tile;return tile.id
}
function lineIndices(dir,n){
  const out=[];for(let k=0;k<4;k++){let r,c;if(dir==='left'){r=n;c=k}else if(dir==='right'){r=n;c=3-k}else if(dir==='up'){r=k;c=n}else{r=3-k;c=n}out.push(r*4+c)}return out
}
function planMove(dir){
  const final=Array(16).fill(null),motions=new Map(),mergedIds=new Set();let gained=0,moved=false;
  for(let n=0;n<4;n++){
    const indices=lineIndices(dir,n),items=indices.map(i=>tiles[i]?{tile:tiles[i],from:i}:null).filter(Boolean),out=[];
    for(const item of items){
      const last=out[out.length-1];
      if(last&&last.value===item.tile.value&&!last.merged){
        last.value*=2;last.merged=true;last.sources.push(item);gained+=last.value;
      }else out.push({value:item.tile.value,merged:false,sources:[item]});
    }
    out.forEach((entry,k)=>{
      const target=indices[k],survivor=entry.sources[0].tile;
      final[target]={id:survivor.id,value:entry.value};
      entry.sources.forEach(src=>{motions.set(src.tile.id,{from:src.from,to:target});if(src.from!==target)moved=true});
      if(entry.sources.length>1){mergedIds.add(survivor.id);moved=true}
    });
  }
  return{final,motions,mergedIds,gained,moved}
}
function animateMove(plan){
  const elements=new Map();tileLayer.querySelectorAll('.tile').forEach(el=>elements.set(Number(el.dataset.id),el));
  plan.motions.forEach((m,id)=>{
    const el=elements.get(id);if(!el)return;
    const a=slotBox(m.from),b=slotBox(m.to);
    el.style.transform=`translate3d(${b.left-a.left}px,${b.top-a.top}px,0)`;
    if(plan.mergedIds.has(id))el.style.zIndex='4';
  });
}
function scorePulse(){scoreEl.classList.remove('score-pop');void scoreEl.offsetWidth;scoreEl.classList.add('score-pop')}
function move(dir){
  if(locked||gameOver)return;
  const plan=planMove(dir);if(!plan.moved)return;
  previous={values:tileValues(),score,wonShown,gameOver};locked=true;animateMove(plan);
  setTimeout(()=>{
    tiles=plan.final;score+=plan.gained;if(plan.gained)scorePulse();
    const spawnId=addRandomTile();renderBoard(spawnId,plan.mergedIds);locked=false;
    try{navigator.vibrate?.(5)}catch(e){}
    if(!wonShown&&tiles.some(t=>t&&t.value>=2048)){wonShown=true;save();showCover('🎉 2048!','Mày đã tới 2048. Có thể tiếp tục chơi.',true)}
    else if(!canMove())finishGame();
  },MOVE_MS+10);
}
function canMove(){
  const v=tileValues();if(v.some(x=>!x))return true;
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){const x=v[r*4+c];if(c<3&&v[r*4+c+1]===x)return true;if(r<3&&v[(r+1)*4+c]===x)return true}
  return false
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({values:tileValues(),score,wonShown,gameOver}))}catch(e){}}
function showCover(title,text,continueMode=false){
  coverTitle.textContent=title;coverText.textContent=text;cover.classList.add('show');const again=document.getElementById('againBtn');again.textContent=continueMode?'Tiếp tục':'Chơi lại';
  again.onclick=()=>{cover.classList.remove('show');if(!continueMode)newGame()}
}
function finishGame(){if(gameOver)return;gameOver=true;save();submitScore();showCover('Game Over','Điểm của mày: '+score)}
function newGame(){if(locked)return;tiles=Array(16).fill(null);score=0;previous=null;wonShown=false;gameOver=false;submitted=false;cover.classList.remove('show');const a=addRandomTile(),b=addRandomTile();renderBoard(b||a)}
function undo(){if(locked||!previous||gameOver)return;tiles=fromValues(previous.values);score=previous.score;wonShown=previous.wonShown;gameOver=previous.gameOver;previous=null;cover.classList.remove('show');renderBoard()}
function submitScore(){if(submitted||!fbRef||score<=0)return;submitted=true;const name=(nameInput.value||playerName||'Player').trim().slice(0,14)||'Player';fbRef.push({name,score,date:Date.now()}).then(prune).catch(()=>{submitted=false})}
function prune(){if(!fbRef)return;fbRef.orderByChild('score').once('value',snap=>{const rows=[];snap.forEach(ch=>rows.push({key:ch.key,score:Number((ch.val()||{}).score||0)}));rows.sort((a,b)=>a.score-b.score);while(rows.length>10){const row=rows.shift();fbRef.child(row.key).remove()}})}
function renderLeaderboard(){leaderboardEl.innerHTML='';if(!leaderboard.length){leaderboardEl.innerHTML='<div class="empty">Chưa có điểm nào.</div>';return}leaderboard.forEach((r,i)=>{const el=document.createElement('div');el.className='row'+(playerName&&r.name===playerName?' me':'');const rank=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';el.innerHTML='<span>'+rank+'</span><span></span><strong></strong>';el.children[1].textContent=r.name;el.children[2].textContent=r.score;leaderboardEl.appendChild(el)})}
if(fbRef)fbRef.on('value',snap=>{const rows=[];snap.forEach(ch=>{const v=ch.val()||{};rows.push({name:v.name||'Player',score:Number(v.score||0),date:v.date||0})});rows.sort((a,b)=>b.score-a.score||a.date-b.date);leaderboard=rows.slice(0,10);renderLeaderboard()},()=>{leaderboardEl.innerHTML='<div class="empty">Không đọc được leaderboard.</div>'});else leaderboardEl.innerHTML='<div class="empty">Firebase chưa sẵn sàng.</div>';

document.getElementById('newBtn').onclick=newGame;document.getElementById('undoBtn').onclick=undo;document.getElementById('saveNameBtn').onclick=()=>{playerName=nameInput.value.trim().slice(0,14);if(!playerName){nameInput.focus();return}try{localStorage.setItem(NAME_KEY,playerName)}catch(e){}renderLeaderboard()};
window.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',A:'left',D:'right',W:'up',S:'down'};if(map[e.key]){e.preventDefault();move(map[e.key])}});
let sx=0,sy=0;boardEl.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;boardEl.setPointerCapture?.(e.pointerId)});boardEl.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
window.addEventListener('resize',()=>renderBoard());

try{
  const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
  if(saved&&Array.isArray(saved.values)&&saved.values.length===16&&!saved.gameOver){tiles=fromValues(saved.values);score=Number(saved.score)||0;wonShown=!!saved.wonShown;renderBoard()}
  else newGame()
}catch(e){newGame()}
</script>
</body>
</html>
