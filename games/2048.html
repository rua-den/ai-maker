<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>2048 — Rùa</title>
<style>html,body{margin:0;width:100%;height:100%;background:#f7f1e8;font-family:'Segoe UI',system-ui,sans-serif}#loading{height:100%;display:grid;place-items:center;color:#776e65;font-weight:900}</style>
</head>
<body>
<div id="loading">Đang tải 2048…</div>
<script>
(async()=>{
  try{
    const response=await fetch('./2048-core.html',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    let html=await response.text();
    const smoothCss=`
<style id="smooth-2048-patch">
html,body{-webkit-user-select:none;user-select:none}.board{will-change:transform;transform:translateZ(0);backface-visibility:hidden}.board.dragging{transition:transform .04s linear}.tile{will-change:transform,filter;transform:translateZ(0);backface-visibility:hidden}.tile-pop{animation:tilePop .16s cubic-bezier(.2,.9,.25,1.35)}.score-pop{animation:scorePop .18s ease-out}.board-enter{animation:boardEnter .2s ease-out}.board-undo{animation:boardUndo .18s ease-out}.board[data-move="left"]{animation:nudgeLeft .12s ease-out}.board[data-move="right"]{animation:nudgeRight .12s ease-out}.board[data-move="up"]{animation:nudgeUp .12s ease-out}.board[data-move="down"]{animation:nudgeDown .12s ease-out}.btn,.home{transition:transform .1s ease,box-shadow .1s ease,filter .12s ease}.btn:hover,.home:hover{filter:brightness(1.035)}
@keyframes tilePop{0%{transform:scale(.78)}58%{transform:scale(1.09)}100%{transform:scale(1)}}@keyframes scorePop{0%{transform:scale(.82);opacity:.6}55%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}@keyframes boardEnter{0%{transform:scale(.97);opacity:.75}100%{transform:scale(1);opacity:1}}@keyframes boardUndo{0%{transform:scale(.985)}50%{transform:scale(1.012)}100%{transform:scale(1)}}@keyframes nudgeLeft{0%{transform:translateX(0)}45%{transform:translateX(-5px)}100%{transform:translateX(0)}}@keyframes nudgeRight{0%{transform:translateX(0)}45%{transform:translateX(5px)}100%{transform:translateX(0)}}@keyframes nudgeUp{0%{transform:translateY(0)}45%{transform:translateY(-5px)}100%{transform:translateY(0)}}@keyframes nudgeDown{0%{transform:translateY(0)}45%{transform:translateY(5px)}100%{transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.tile-pop,.score-pop,.board-enter,.board-undo,.board[data-move]{animation:none!important}.board.dragging{transition:none}}
</style>`;
    html=html.replace('</head>',smoothCss+'\n</head>');
    html=html.replace('</body>','<script src="./2048-smooth.js"><\\/script>\n</body>');
    document.open();document.write(html);document.close();
  }catch(error){document.getElementById('loading').textContent='Không tải được 2048. Hãy reload trang.';console.error('2048 loader failed:',error)}
})();
</script>
</body>
</html>
