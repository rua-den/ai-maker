<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>2048 — Rùa</title>
<style>html,body{margin:0;width:100%;height:100%;background:#f7f1e8;font-family:'Segoe UI',system-ui,sans-serif}#loading{height:100%;display:grid;place-items:center;color:#776e65;font-weight:900}</style>
</head>
<body>
<div id="loading">Đang tải 2048…</div>
<script>
(async()=>{
  try{
    const response=await fetch('./2048-core.html',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    let html=await response.text();
    const smoothCss=`
<style id="smooth-2048-patch">
html,body{-webkit-user-select:none;user-select:none}
.board{transform:none!important;will-change:auto;contain:layout paint;}
.tile{position:relative;overflow:hidden;transform:none!important;will-change:auto;}
.tile-value{display:block;transform:translateZ(0);backface-visibility:hidden;pointer-events:none;}
.tile-value.pop{animation:tileValuePop .14s cubic-bezier(.2,.85,.25,1.25)}
.score-pop{animation:scorePop .16s ease-out}
.btn,.home{transition:transform .1s ease,box-shadow .1s ease,filter .12s ease}
.btn:hover,.home:hover{filter:brightness(1.035)}
@keyframes tileValuePop{0%{transform:scale(.88);opacity:.72}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes scorePop{0%{transform:scale(.9);opacity:.7}55%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.tile-value.pop,.score-pop{animation:none!important}}
</style>`;
    html=html.replace('</head>',smoothCss+'\n</head>');
    html=html.replace('</body>','<script src="./2048-smooth.js"><\\/script>\n</body>');
    document.open();document.write(html);document.close();
  }catch(error){document.getElementById('loading').textContent='Không tải được 2048. Hãy reload trang.';console.error('2048 loader failed:',error)}
})();
</script>
</body>
</html>
