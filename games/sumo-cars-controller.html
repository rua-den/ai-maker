<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sumo Cars — Controller</title>
<link rel="stylesheet" href="../assets/app-fonts.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#05080d;color:#f7fbff;overflow:hidden;overscroll-behavior:none;touch-action:none}button,input{font:inherit}.app{width:100%;height:100dvh;display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:radial-gradient(circle at 50% -15%,#24425e,#0a1521 48%,#04070b)}.lobby{width:min(540px,100%);max-height:100%;overflow:auto;padding:20px;border-radius:24px;background:rgba(7,15,24,.95);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 80px rgba(0,0,0,.4)}.lobby.hide{display:none}.logo{text-align:center;font-size:56px}.title{text-align:center;font-size:34px;font-weight:1000;font-style:italic;margin:-2px 0 4px}.sub{text-align:center;font-size:10px;opacity:.55;letter-spacing:.13em;font-weight:950;margin-bottom:16px}.fields{display:grid;grid-template-columns:1fr .72fr;gap:10px}.field label{display:block;font-size:10px;font-weight:950;letter-spacing:.1em;color:#79e5ff;margin:0 0 5px}.field input{width:100%;border:2px solid rgba(255,255,255,.12);border-radius:14px;background:#f8fbff;color:#0b2b3c;padding:12px;text-align:center;font-size:18px;font-weight:950;outline:0}.roomInput{text-transform:uppercase;letter-spacing:.18em}.join{margin-top:12px;width:100%;border:0;border-radius:15px;padding:14px;background:#8df5b2;color:#07341d;font-size:16px;font-weight:1000;box-shadow:0 5px 0 #32905a}.join:active{transform:translateY(3px);box-shadow:0 2px 0 #32905a}.msg{min-height:18px;text-align:center;margin-top:9px;font-size:11px;font-weight:850;color:#ffe074}.back{display:block;text-align:center;margin-top:8px;color:#a9ddff;text-decoration:none;font-size:10px;font-weight:850;opacity:.75}.play{display:none;position:relative;width:100%;height:100%}.play.show{display:block}.pad{width:100%;height:100%;display:grid;grid-template-columns:minmax(180px,.9fr) minmax(150px,.55fr) minmax(220px,1fr);gap:10px}.zone,.hud{position:relative;border-radius:24px;background:rgba(8,17,27,.88);border:1px solid rgba(255,255,255,.1);overflow:hidden;min-width:0}.boostZone{display:grid;place-items:center}.boost{width:min(70%,250px);aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ff8c8c,#ea3f52 54%,#9e1e32 100%);color:white;font-size:clamp(22px,5vw,42px);font-weight:1000;box-shadow:inset 0 -10px 0 rgba(0,0,0,.22),0 0 34px rgba(255,67,88,.25);touch-action:none;user-select:none}.boost.active{transform:scale(.95) translateY(3px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),0 0 45px rgba(255,91,110,.45)}.boost.cooldown{filter:grayscale(.72);opacity:.5}.zoneLabel{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:9px;font-weight:1000;letter-spacing:.16em;opacity:.45}.hud{display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:center;padding:10px}.topline{display:flex;justify-content:space-between;gap:6px}.badge,.alive{padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);font-size:9px;font-weight:950}.alive{color:#8df5b2}.driver{font-size:clamp(18px,3vw,28px);font-weight:1000;margin:8px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.state{min-height:28px;display:grid;place-items:center;font-size:10px;font-weight:850;line-height:1.25;opacity:.7}.boostMeter{margin:7px 0 3px;height:9px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}.boostFill{height:100%;width:100%;background:#8df5b2;transition:width .08s linear}.leave{margin-top:5px;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:7px;background:transparent;color:#d9edf6;font-size:9px;font-weight:850}.stickZone{display:grid;place-items:center}.stickBase{position:relative;width:min(76%,270px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(109,188,238,.13),rgba(17,35,50,.92) 68%);border:2px solid rgba(132,212,255,.25);box-shadow:inset 0 0 30px rgba(0,0,0,.35);touch-action:none}.stickBase::before,.stickBase::after{content:'';position:absolute;background:rgba(255,255,255,.08)}.stickBase::before{left:50%;top:9%;bottom:9%;width:1px}.stickBase::after{top:50%;left:9%;right:9%;height:1px}.stickKnob{position:absolute;left:50%;top:50%;width:37%;aspect-ratio:1;border-radius:50%;background:linear-gradient(180deg,#7ce7ff,#2d8db5);border:2px solid rgba(255,255,255,.5);transform:translate(-50%,-50%);box-shadow:0 8px 25px rgba(0,0,0,.35);pointer-events:none}.rotate{display:none;position:absolute;inset:0;z-index:20;background:#06101a;place-items:center;text-align:center;padding:30px}.rotate strong{display:block;font-size:25px;margin-top:8px}.rotate p{opacity:.6;font-size:13px}@media(orientation:portrait){.play.show .rotate{display:grid}}@media(max-height:430px) and (orientation:landscape){.pad{gap:7px}.zone,.hud{border-radius:17px}.hud{padding:7px}.driver{margin:4px 0 1px}.state{min-height:21px}.boostMeter{margin:4px 0 2px}.leave{padding:5px}.zoneLabel{top:6px;font-size:8px}}@media(max-width:620px) and (orientation:portrait){.fields{grid-template-columns:1fr}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="sumo-cars-core.js"></script>
</head>
<body>
<main class="app">
<section id="lobby" class="lobby"><div class="logo">🚗💥</div><div class="title">SUMO CARS</div><div class="sub">PHONE CONTROLLER · 1 JOYSTICK + 1 BOOST</div><div class="fields"><div class="field"><label>TÊN</label><input id="name" maxlength="16" autocomplete="nickname" placeholder="Rùa Đen"></div><div class="field"><label>MÃ PHÒNG</label><input id="room" class="roomInput" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD"></div></div><button id="join" class="join">VÀO PHÒNG</button><div id="msg" class="msg"></div><a class="back" href="sumo-cars-start.html">← Tạo / vào phòng khác</a></section>
<section id="play" class="play"><div class="pad"><section class="zone boostZone"><div class="zoneLabel">BOOST / RAM</div><button id="boost" class="boost" type="button">BOOST</button></section><section class="hud"><div class="topline"><div id="badge" class="badge">ROOM ····</div><div id="alive" class="alive">WAIT</div></div><div id="driver" class="driver">Driver</div><div id="state" class="state">Đang kết nối…</div><div class="boostMeter"><div id="boostFill" class="boostFill"></div></div><button id="leave" class="leave" type="button">RỜI PHÒNG</button></section><section class="zone stickZone"><div class="zoneLabel">JOYSTICK · HƯỚNG CHẠY</div><div id="stick" class="stickBase"><div id="knob" class="stickKnob"></div></div></section></div><div class="rotate"><div><div style="font-size:64px">📱↻</div><strong>Xoay ngang điện thoại</strong><p>BOOST bên trái · joystick bên phải.</p></div></div></section>
</main>
<script>
(()=>{
'use strict';
const C=window.SumoCarsCore,lobby=document.getElementById('lobby'),play=document.getElementById('play'),nameEl=document.getElementById('name'),roomEl=document.getElementById('room'),joinBtn=document.getElementById('join'),msgEl=document.getElementById('msg'),badgeEl=document.getElementById('badge'),driverEl=document.getElementById('driver'),stateEl=document.getElementById('state'),aliveEl=document.getElementById('alive'),boostBtn=document.getElementById('boost'),boostFill=document.getElementById('boostFill'),stick=document.getElementById('stick'),knob=document.getElementById('knob'),leaveBtn=document.getElementById('leave');
let db=null,roomRef=null,playerRef=null,disconnectOp=null,statusRef=null,hudRef=null,currentCode='',clientId='',joined=false,seq=0,boostSeq=0,x=0,y=0,boost=false,lastSent='';
const queryCode=C.cleanRoomCode(new URLSearchParams(location.search).get('room'));
try{clientId=localStorage.getItem('sumoCarsClientId')||'';if(!clientId){clientId=(crypto.randomUUID?.()||('p'+Date.now()+Math.random())).replace(/[^a-z0-9]/gi,'').slice(0,32);localStorage.setItem('sumoCarsClientId',clientId)}nameEl.value=localStorage.getItem('sumoCarsName')||''}catch(e){clientId='p'+Date.now()+Math.random()}
if(queryCode)roomEl.value=queryCode;
function message(t){msgEl.textContent=t||''}
function requestLandscape(){try{const p=screen.orientation?.lock?.('landscape');if(p?.catch)p.catch(()=>{})}catch(e){}}
function init(){try{if(!window.firebase||typeof firebaseConfig==='undefined')throw new Error('firebase_missing');if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.database();message(queryCode?'Nhập tên rồi vào phòng '+queryCode+'.':'Nhập tên và mã phòng.')}catch(e){console.error(e);message('Không kết nối được Firebase.')}}
async function joinRoom(){if(!db)return message('Firebase chưa sẵn sàng.');requestLandscape();const code=C.cleanRoomCode(roomEl.value),name=C.cleanName(nameEl.value);if(code.length!==4)return message('Mã phòng gồm 4 ký tự.');joinBtn.disabled=true;message('Đang vào arena…');const ref=db.ref(`${C.ROOT}/${C.roomKey(code)}`);try{const snap=await ref.once('value'),room=snap.val();if(!room||room.kind!==C.ROOM_KIND)throw new Error('room_not_found');if(!['waiting','finished'].includes(room.status))throw new Error('round_running');const players=room.players||{},exists=!!players[clientId];if(!exists&&Object.keys(players).length>=C.MAX_PLAYERS)throw new Error('room_full');currentCode=code;roomRef=ref;playerRef=ref.child('players').child(clientId);await playerRef.set({name,joinedAt:firebase.database.ServerValue.TIMESTAMP,input:{x:0,y:0,boost:false,boostSeq,seq:0,at:firebase.database.ServerValue.TIMESTAMP}});disconnectOp=playerRef.onDisconnect();disconnectOp.remove();try{localStorage.setItem('sumoCarsName',name)}catch(e){}joined=true;driverEl.textContent=name;badgeEl.textContent='ROOM '+code;lobby.classList.add('hide');play.classList.add('show');statusRef=roomRef.child('status');statusRef.on('value',s=>updateRoomStatus(String(s.val()||'waiting')));hudRef=roomRef.child('hud').child(clientId);hudRef.on('value',s=>updateHud(s.val()));sendInput(true)}catch(err){console.error(err);joinBtn.disabled=false;if(err.message==='room_not_found')message('Không tìm thấy phòng '+code+'.');else if(err.message==='round_running')message('Ván đang chạy, chờ ván kế tiếp.');else if(err.message==='room_full')message('Phòng đủ '+C.MAX_PLAYERS+' người rồi.');else message('Không vào được phòng. Thử lại.')}}
function updateRoomStatus(s){if(s==='waiting')stateEl.textContent='Đã vào phòng · chờ host bắt đầu';else if(s==='countdown')stateEl.textContent='Chuẩn bị! 3… 2… 1…';else if(s==='playing')stateEl.textContent='HÚC TỤI NÓ RA NGOÀI!';else if(s==='finished')stateEl.textContent='Hết ván · chờ host chơi tiếp';else stateEl.textContent='Đang kết nối…'}
function updateHud(h){h=h||{};aliveEl.textContent=h.alive===false?'OUT':(h.alive===true?'ALIVE':'WAIT');aliveEl.style.color=h.alive===false?'#ff8291':'#8df5b2';const ms=Math.max(0,Number(h.boostMs)||0),ready=ms<=0;boostBtn.classList.toggle('cooldown',!ready);boostFill.style.width=(ready?100:Math.max(0,100-ms/C.BOOST_COOLDOWN_MS*100))+'%';boostBtn.textContent=ready?'BOOST':Math.ceil(ms/100)/10+'s'}
function sendInput(force=false){if(!joined||!playerRef)return;const payload={x:Math.round(x*1000)/1000,y:Math.round(y*1000)/1000,boost,boostSeq,seq:++seq,at:firebase.database.ServerValue.TIMESTAMP};const key=[payload.x,payload.y,payload.boost,payload.boostSeq].join('|');if(!force&&key===lastSent)return;lastSent=key;playerRef.child('input').set(payload).catch(()=>{})}
setInterval(()=>sendInput(false),50);setInterval(()=>{if(joined)sendInput(true)},500);
function stickPoint(ev){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=ev.clientX-cx,dy=ev.clientY-cy,max=r.width*.33,m=Math.hypot(dx,dy)||1,k=Math.min(1,max/m);x=C.clamp(dx/max,-1,1);y=C.clamp(dy/max,-1,1);if(Math.hypot(x,y)<.08){x=0;y=0}knob.style.transform=`translate(calc(-50% + ${dx*k}px),calc(-50% + ${dy*k}px))`;sendInput(true)}
function resetStick(){x=0;y=0;knob.style.transform='translate(-50%,-50%)';sendInput(true)}
stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);stickPoint(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))stickPoint(e)});stick.addEventListener('pointerup',e=>{try{stick.releasePointerCapture(e.pointerId)}catch(_){ }resetStick()});stick.addEventListener('pointercancel',resetStick);
function boostDown(e){e.preventDefault();boost=true;boostSeq++;boostBtn.classList.add('active');sendInput(true);try{boostBtn.setPointerCapture(e.pointerId)}catch(_){} }
function boostUp(e){boost=false;boostBtn.classList.remove('active');sendInput(true);try{boostBtn.releasePointerCapture(e.pointerId)}catch(_){} }
boostBtn.addEventListener('pointerdown',boostDown);boostBtn.addEventListener('pointerup',boostUp);boostBtn.addEventListener('pointercancel',boostUp);
async function leave(){joined=false;statusRef?.off();hudRef?.off();try{await playerRef?.remove()}catch(e){}location.href='sumo-cars-controller.html'+(currentCode?'?room='+encodeURIComponent(currentCode):'')}
leaveBtn.addEventListener('click',leave);joinBtn.addEventListener('click',joinRoom);roomEl.addEventListener('input',()=>roomEl.value=C.cleanRoomCode(roomEl.value));window.addEventListener('pagehide',()=>{statusRef?.off();hudRef?.off()});init();
})();
</script>
</body></html>
