<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Caro Online — Rùa</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at top,#24414d,#12242c 58%,#0b171c);color:#fff;overscroll-behavior:none}.app{width:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px}.home{position:fixed;top:14px;left:14px;z-index:30;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;text-decoration:none;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.2);font-size:20px}.panel{background:rgba(12,28,34,.96);border:1px solid rgba(255,255,255,.14);border-radius:16px;box-shadow:0 16px 50px rgba(0,0,0,.45);backdrop-filter:blur(8px)}#lobby{width:min(94vw,470px);max-height:calc(100dvh - 34px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}h1{margin:0;text-align:center;font-size:clamp(30px,9vw,44px);font-weight:1000}.sub{text-align:center;font-size:13px;opacity:.72;font-weight:700}.nameRow{display:flex;gap:8px}.nameRow input{flex:1;min-width:0;border:2px solid rgba(255,255,255,.15);border-radius:10px;padding:11px 12px;background:#f7fbfc;color:#18313b;font:inherit;font-weight:850;outline:none}.nameRow input:focus{border-color:#53d6c2}.btn{border:0;border-radius:10px;padding:10px 13px;font-size:13px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(180deg,#66e1cf,#35bba8);color:#08362f;box-shadow:0 3px 0 #1a8174}.secondary{background:rgba(255,255,255,.11);color:#fff;border:1px solid rgba(255,255,255,.15)}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:3px}.sectionHead strong{font-size:13px;letter-spacing:.7px}.sectionHead button{border:0;background:transparent;color:#7de9d8;font-weight:900;cursor:pointer}.rooms{display:flex;flex-direction:column;gap:7px;max-height:260px;overflow:auto}.room{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.08)}.roomInfo{min-width:0;flex:1}.roomName{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roomMeta{font-size:11px;opacity:.62;margin-top:2px}.join{background:#f1c75b;color:#3c2d00}.empty{text-align:center;padding:16px 8px;opacity:.58;font-size:12px;font-weight:700}.status{min-height:18px;text-align:center;font-size:12px;color:#ffd787;font-weight:750}.rules{font-size:11px;line-height:1.5;opacity:.58;text-align:center}.game{display:none;width:min(96vw,720px);height:min(96vh,760px);flex-direction:column;gap:10px;align-items:center}.game.show{display:flex}.topBar{width:min(96vw,650px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px}.turn{font-size:13px;font-weight:900;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topActions{display:flex;gap:6px}.topActions .btn{padding:7px 10px;font-size:12px}.boardWrap{position:relative;width:min(92vw,650px);height:min(92vw,650px);max-height:calc(100dvh - 125px);aspect-ratio:1}.board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);background:#e7bd74;border:7px solid #9b6833;border-radius:10px;box-shadow:0 16px 45px rgba(0,0,0,.42);touch-action:none;user-select:none}.cell{border-right:1px solid rgba(75,45,20,.45);border-bottom:1px solid rgba(75,45,20,.45);display:grid;place-items:center;position:relative;cursor:pointer}.cell:nth-child(15n){border-right:0}.cell:nth-last-child(-n+15){border-bottom:0}.stone{width:76%;height:76%;border-radius:50%;display:grid;place-items:center;font-size:clamp(12px,3.5vw,26px);font-weight:1000;line-height:1}.stone.x{background:radial-gradient(circle at 35% 30%,#ff8f88,#e6483f 55%,#9f201a);color:#fff;box-shadow:0 3px 6px rgba(70,0,0,.35)}.stone.o{background:radial-gradient(circle at 35% 30%,#f7f7f7,#bfcbd0 58%,#61727b);color:#24353c;box-shadow:0 3px 6px rgba(0,0,0,.3)}.cell.last::after{content:'';position:absolute;width:18%;height:18%;border-radius:50%;background:#ffe05d;box-shadow:0 0 0 2px rgba(0,0,0,.18)}.badge{font-size:11px;font-weight:900;border-radius:999px;padding:6px 10px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.14);color:#8ef0e1}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(7,17,21,.72);border-radius:10px;z-index:5}.overlay.show{display:flex}.result{width:min(82%,330px);padding:20px;text-align:center}.result h2{margin:0 0 8px;font-size:28px}.result p{margin:0 0 14px;font-size:13px;opacity:.78;font-weight:700}
@media(max-width:520px){.app{padding:8px}.home{width:38px;height:38px;top:9px;left:9px}.game{justify-content:center}.topBar{width:94vw}.boardWrap{width:94vw;height:94vw;max-height:calc(100dvh - 112px)}#lobby{padding:15px;margin-top:46px;max-height:calc(100dvh - 58px)}.nameRow{flex-direction:column}.nameRow .btn{width:100%}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>

<!-- Global Vietnamese/CJK-safe font stack -->
<link rel="stylesheet" href="../assets/app-fonts.css">
</head>
<body>
<a class="home" href="../index.html">🐢</a>
<div class="app">
  <section id="lobby" class="panel">
    <h1>⭕ CARO ❌</h1>
    <div class="sub">2 người · 2 điện thoại · chọn bàn đang chờ để vào chơi</div>
    <div class="nameRow"><input id="nameInput" maxlength="14" autocomplete="off" placeholder="Tên của bạn"><button id="createBtn" class="btn primary">＋ Tạo bàn</button></div>
    <div id="status" class="status"></div>
    <div class="sectionHead"><strong>🌐 BÀN ĐANG CHỜ</strong><button id="refreshBtn">↻ Làm mới</button></div>
    <div id="rooms" class="rooms"></div>
    <div class="rules">Luật: ai có 5 quân liên tiếp theo hàng ngang, dọc hoặc chéo trước thì thắng. Chủ bàn cầm ❌, người vào bàn cầm ⭕.</div>
  </section>

  <section id="game" class="game">
    <div class="topBar panel"><div id="turnText" class="turn">Đang kết nối…</div><div class="topActions"><span id="roomBadge" class="badge"></span><button id="leaveBtn" class="btn secondary">Rời bàn</button></div></div>
    <div class="boardWrap"><div id="board" class="board"></div><div id="resultOverlay" class="overlay"><div class="result panel"><h2 id="resultTitle">Kết thúc</h2><p id="resultText"></p><button id="backLobbyBtn" class="btn primary">Về sảnh</button></div></div></div>
  </section>
</div>
<script>
const SIZE=15,CELLS=SIZE*SIZE,EMPTY='.',ROOT='caroRooms',CLIENT_KEY='caroClientId',NAME_KEY='caroPlayerName',ROOM_KEY='caroActiveRoom',SEAT_KEY='caroActiveSeat';
const lobby=document.getElementById('lobby'),game=document.getElementById('game'),roomsEl=document.getElementById('rooms'),statusEl=document.getElementById('status'),nameInput=document.getElementById('nameInput'),boardEl=document.getElementById('board'),turnText=document.getElementById('turnText'),roomBadge=document.getElementById('roomBadge'),resultOverlay=document.getElementById('resultOverlay'),resultTitle=document.getElementById('resultTitle'),resultText=document.getElementById('resultText');
let clientId='';try{clientId=localStorage.getItem(CLIENT_KEY)||'';if(!clientId){clientId=(crypto.randomUUID?.()||('c'+Date.now()+Math.random())).replace(/[^a-z0-9]/gi,'').slice(0,32);localStorage.setItem(CLIENT_KEY,clientId)}nameInput.value=localStorage.getItem(NAME_KEY)||''}catch(e){clientId='c'+Date.now()+Math.random()}
let db=null,roomsRef=null,roomRef=null,roomHandler=null,lobbyQuery=null,lobbyHandler=null,roomId=null,seat=null,roomState=null,waitingDisconnect=null;
try{if(window.firebase&&typeof firebaseConfig!=='undefined'){if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.database();roomsRef=db.ref(ROOT)}}catch(e){console.error(e)}
function setStatus(t){statusEl.textContent=t||''}function cleanName(v){return String(v||'').trim().replace(/\s+/g,' ').slice(0,14)}function saveName(){const n=cleanName(nameInput.value);if(!n){setStatus('Nhập tên trước đã.');nameInput.focus();return null}try{localStorage.setItem(NAME_KEY,n)}catch(e){}return n}
function boardString(){return EMPTY.repeat(CELLS)}function at(b,r,c){return b[r*SIZE+c]}function won(b,idx,mark){const r=Math.floor(idx/SIZE),c=idx%SIZE,dirs=[[1,0],[0,1],[1,1],[1,-1]];return dirs.some(([dr,dc])=>{let count=1;for(const s of [-1,1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<SIZE&&cc>=0&&cc<SIZE&&at(b,rr,cc)===mark){count++;rr+=dr*s;cc+=dc*s}}return count>=5})}
function roomAge(ts){const m=Math.max(0,Math.floor((Date.now()-(ts||Date.now()))/60000));return m===0?'vừa tạo':m+' phút trước'}
function stopLobby(){if(lobbyQuery&&lobbyHandler)lobbyQuery.off('value',lobbyHandler);lobbyQuery=lobbyHandler=null}
function watchLobby(){if(!roomsRef){roomsEl.innerHTML='<div class="empty">Firebase chưa sẵn sàng.</div>';return}stopLobby();lobbyQuery=roomsRef.orderByChild('status').equalTo('waiting').limitToLast(30);lobbyHandler=snap=>{const rows=[];snap.forEach(ch=>{const r=ch.val()||{};if(Date.now()-(r.createdAt||0)<=30*60*1000)rows.push({id:ch.key,r})});rows.sort((a,b)=>(b.r.createdAt||0)-(a.r.createdAt||0));renderRooms(rows)};lobbyQuery.on('value',lobbyHandler,()=>roomsEl.innerHTML='<div class="empty">Không đọc được danh sách bàn. Kiểm tra Firebase rules.</div>')}
function renderRooms(rows){roomsEl.innerHTML='';if(!rows.length){roomsEl.innerHTML='<div class="empty">Chưa có bàn nào đang chờ.</div>';return}rows.forEach(({id,r})=>{const el=document.createElement('div');el.className='room';const info=document.createElement('div');info.className='roomInfo';const n=document.createElement('div');n.className='roomName';n.textContent='❌ '+((r.x&&r.x.name)||'Người chơi');const m=document.createElement('div');m.className='roomMeta';m.textContent='Bàn #'+id.slice(-5).toUpperCase()+' · '+roomAge(r.createdAt);info.append(n,m);const b=document.createElement('button');b.className='btn join';const own=r.x&&r.x.clientId===clientId;b.textContent=own?'Bàn của bạn':'Vào bàn';b.disabled=own;if(!own)b.onclick=()=>joinRoom(id);el.append(info,b);roomsEl.appendChild(el)})}
async function createRoom(){if(!roomsRef)return setStatus('Firebase chưa sẵn sàng.');const name=saveName();if(!name)return;document.getElementById('createBtn').disabled=true;const ref=roomsRef.push();try{await ref.set({status:'waiting',createdAt:Date.now(),updatedAt:Date.now(),x:{name,clientId},o:null,board:boardString(),turn:'X',lastMove:-1,winner:null,reason:null});waitingDisconnect=ref.onDisconnect();await waitingDisconnect.remove();bindRoom(ref.key,'X');setStatus('Đã tạo bàn — đang chờ người khác vào…')}catch(e){setStatus('Không tạo được bàn. Firebase có thể đang chặn quyền ghi.')}finally{document.getElementById('createBtn').disabled=false}}
function joinRoom(id){if(!roomsRef)return;const name=saveName();if(!name)return;setStatus('Đang vào bàn…');const ref=roomsRef.child(id);ref.transaction(r=>{if(!r||r.status!=='waiting'||r.o)return;r.o={name,clientId};r.status='playing';r.updatedAt=Date.now();r.board=(typeof r.board==='string'&&r.board.length===CELLS)?r.board:boardString();r.turn='X';return r},(err,committed)=>{if(err||!committed){setStatus('Bàn vừa có người vào hoặc không còn tồn tại.');return}bindRoom(id,'O')},false)}
function detachRoom(){if(roomRef&&roomHandler)roomRef.off('value',roomHandler);roomHandler=null}
function saveActive(){try{localStorage.setItem(ROOM_KEY,roomId||'');localStorage.setItem(SEAT_KEY,seat||'')}catch(e){}}function clearActive(){try{localStorage.removeItem(ROOM_KEY);localStorage.removeItem(SEAT_KEY)}catch(e){}}
function bindRoom(id,mySeat){detachRoom();roomId=id;seat=mySeat;roomRef=roomsRef.child(id);saveActive();roomHandler=snap=>{const r=snap.val();if(!r){clearActive();showLobby('Bàn không còn tồn tại.');return}roomState=r;if(r.status!=='waiting'&&waitingDisconnect){waitingDisconnect.cancel();waitingDisconnect=null}if(r.status==='waiting'){lobby.style.display='flex';game.classList.remove('show');setStatus('✅ Bàn #'+id.slice(-5).toUpperCase()+' đã tạo — chờ người khác vào…');return}lobby.style.display='none';game.classList.add('show');renderGame(r)};roomRef.on('value',roomHandler,()=>setStatus('Mất kết nối với bàn.'))}
function renderGame(r){roomBadge.textContent='#'+roomId.slice(-5).toUpperCase()+' · '+(seat==='X'?'Bạn ❌':'Bạn ⭕');const xn=(r.x&&r.x.name)||'X',on=(r.o&&r.o.name)||'O';const turnName=r.turn==='X'?xn:on;turnText.textContent=r.status==='playing'?'Lượt: '+turnName+' '+(r.turn==='X'?'❌':'⭕')+(r.turn===seat?' — tới lượt bạn':''):'Ván đã kết thúc';const b=(typeof r.board==='string'&&r.board.length===CELLS)?r.board:boardString();boardEl.innerHTML='';for(let i=0;i<CELLS;i++){const c=document.createElement('div');c.className='cell'+(Number(r.lastMove)===i?' last':'');const v=b[i];if(v==='X'||v==='O'){const s=document.createElement('div');s.className='stone '+v.toLowerCase();s.textContent=v==='X'?'×':'○';c.appendChild(s)}else if(r.status==='playing'&&r.turn===seat)c.onclick=()=>playMove(i);boardEl.appendChild(c)}if(r.status==='finished'){resultOverlay.classList.add('show');if(r.winner==='X'||r.winner==='O'){const who=r.winner==='X'?xn:on;resultTitle.textContent='🎉 '+who+' thắng!';resultText.textContent=r.reason||'5 quân liên tiếp.'}else{resultTitle.textContent='🤝 Hòa';resultText.textContent=r.reason||'Bàn đã đầy.'}}else resultOverlay.classList.remove('show')}
function playMove(idx){if(!roomRef||!roomState||roomState.status!=='playing'||roomState.turn!==seat)return;roomRef.transaction(r=>{if(!r||r.status!=='playing'||r.turn!==seat)return;const p=seat==='X'?r.x:r.o;if(!p||p.clientId!==clientId)return;let b=(typeof r.board==='string'&&r.board.length===CELLS)?r.board:boardString();if(b[idx]!==EMPTY)return;b=b.slice(0,idx)+seat+b.slice(idx+1);r.board=b;r.lastMove=idx;r.updatedAt=Date.now();if(won(b,idx,seat)){r.status='finished';r.winner=seat;r.reason='5 quân liên tiếp';r.finishedAt=Date.now()}else if(!b.includes(EMPTY)){r.status='finished';r.winner=null;r.reason='Bàn đã đầy';r.finishedAt=Date.now()}else r.turn=seat==='X'?'O':'X';return r},()=>{},false)}
function showLobby(msg){detachRoom();roomRef=null;roomId=null;seat=null;roomState=null;clearActive();resultOverlay.classList.remove('show');game.classList.remove('show');lobby.style.display='flex';if(msg)setStatus(msg);watchLobby()}
function leaveRoom(){if(!roomRef||!roomState){showLobby();return}const mySeat=seat,op=mySeat==='X'?'O':'X';roomRef.transaction(r=>{if(!r)return;if(r.status==='waiting'&&mySeat==='X'&&r.x&&r.x.clientId===clientId)return null;if(r.status==='playing'){const p=mySeat==='X'?r.x:r.o;if(!p||p.clientId!==clientId)return;r.status='finished';r.winner=op;r.reason='đối thủ rời bàn';r.finishedAt=Date.now();r.updatedAt=Date.now()}return r},()=>showLobby('Đã rời bàn.'),false)}
function restore(){if(!roomsRef)return;let id='',s='';try{id=localStorage.getItem(ROOM_KEY)||'';s=localStorage.getItem(SEAT_KEY)||''}catch(e){}if(!id||!['X','O'].includes(s))return;roomsRef.child(id).once('value').then(snap=>{const r=snap.val(),p=s==='X'?r&&r.x:r&&r.o;if(r&&p&&p.clientId===clientId&&['waiting','playing'].includes(r.status))bindRoom(id,s);else clearActive()}).catch(()=>{})}
document.getElementById('createBtn').onclick=createRoom;document.getElementById('refreshBtn').onclick=watchLobby;document.getElementById('leaveBtn').onclick=leaveRoom;document.getElementById('backLobbyBtn').onclick=()=>showLobby();watchLobby();setTimeout(restore,60);
</script>
</body>
</html>
