<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>2048 — Rùa</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:#f7f1e8;color:#5c5148;overscroll-behavior:none}body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}.app{width:min(94vw,520px);display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.home{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;text-decoration:none;background:#8f7a66;color:#fff;font-size:20px;box-shadow:0 4px 0 #6d5c4d}.title h1{font-size:clamp(38px,12vw,58px);line-height:.9;margin:0;font-weight:1000;color:#776e65}.title p{margin:8px 0 0;font-size:13px;font-weight:700;opacity:.75}.scores{display:flex;gap:7px}.scoreBox{min-width:78px;background:#bbada0;color:#fff;border-radius:9px;padding:7px 10px;text-align:center;font-weight:900}.scoreBox small{display:block;font-size:10px;letter-spacing:.7px;opacity:.85}.scoreBox strong{display:block;font-size:19px;margin-top:2px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#8f7a66;color:#fff;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 3px 0 #6d5c4d}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6d5c4d}.boardWrap{position:relative}.board{width:100%;aspect-ratio:1;background:#bbada0;border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;touch-action:none;user-select:none}.tile{border-radius:9px;display:grid;place-items:center;background:#cdc1b4;color:#776e65;font-size:clamp(25px,8vw,42px);font-weight:1000;transition:transform .08s;min-width:0}.tile[data-v="2"]{background:#eee4da}.tile[data-v="4"]{background:#ede0c8}.tile[data-v="8"]{background:#f2b179;color:#f9f6f2}.tile[data-v="16"]{background:#f59563;color:#f9f6f2}.tile[data-v="32"]{background:#f67c5f;color:#f9f6f2}.tile[data-v="64"]{background:#f65e3b;color:#f9f6f2}.tile[data-v="128"]{background:#edcf72;color:#f9f6f2;font-size:clamp(22px,7vw,36px)}.tile[data-v="256"]{background:#edcc61;color:#f9f6f2;font-size:clamp(22px,7vw,36px)}.tile[data-v="512"]{background:#edc850;color:#f9f6f2;font-size:clamp(22px,7vw,36px)}.tile[data-v="1024"]{background:#edc53f;color:#f9f6f2;font-size:clamp(18px,6vw,31px)}.tile[data-v="2048"]{background:#edc22e;color:#f9f6f2;font-size:clamp(18px,6vw,31px);box-shadow:0 0 24px rgba(237,194,46,.55)}.tile.big{background:#3c3a32;color:#f9f6f2;font-size:clamp(16px,5vw,27px)}.cover{position:absolute;inset:0;border-radius:12px;background:rgba(238,228,218,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;z-index:4}.cover.show{display:flex}.cover h2{margin:0;font-size:32px;font-weight:1000;color:#776e65}.cover p{margin:0;font-weight:800}.panel{background:#fff;border-radius:12px;padding:13px 14px;box-shadow:0 8px 24px rgba(95,73,51,.1)}.nameRow{display:flex;gap:8px}.nameRow input{flex:1;min-width:0;border:2px solid #d8cec3;border-radius:9px;padding:9px 11px;font:inherit;font-weight:800;color:#5c5148;outline:none}.nameRow input:focus{border-color:#f2b179}.leaderTitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.leaderTitle strong{font-size:15px}.leaderTitle span{font-size:11px;opacity:.65;font-weight:700}.leaderboard{display:flex;flex-direction:column;gap:5px;max-height:170px;overflow:auto}.row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;border-radius:8px;padding:6px 8px;background:#f7f2ec;font-size:13px;font-weight:800}.row.me{background:#fff0c8;outline:1px solid #edc22e}.empty{text-align:center;padding:10px;font-size:12px;opacity:.6;font-weight:700}.hint{text-align:center;font-size:12px;line-height:1.5;font-weight:700;opacity:.68;padding-bottom:env(safe-area-inset-bottom)}
@media(max-width:430px){body{padding:12px}.app{gap:11px}.title p{display:none}.scoreBox{min-width:66px;padding:6px 7px}.scoreBox strong{font-size:17px}.board{padding:8px;gap:8px}.panel{padding:11px}.actions .btn{flex:1}.actions{width:100%}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>

<!-- Global Vietnamese/CJK-safe font stack -->
<link rel="stylesheet" href="../assets/app-fonts.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><a class="home" href="../index.html">🐢</a><div class="title"><h1>2048</h1><p>Ghép các ô giống nhau để lên 2048.</p></div></div>
    <div class="scores"><div class="scoreBox"><small>ĐIỂM</small><strong id="score">0</strong></div><div class="scoreBox"><small>BEST</small><strong id="best">0</strong></div></div>
  </div>
  <div class="actions"><button class="btn" id="newBtn">↻ Ván mới</button><button class="btn" id="undoBtn">↩ Undo</button></div>
  <div class="boardWrap"><div class="board" id="board"></div><div class="cover" id="cover"><h2 id="coverTitle">Game Over</h2><p id="coverText"></p><button class="btn" id="againBtn">Chơi lại</button></div></div>
  <div class="panel"><div class="nameRow"><input id="nameInput" maxlength="14" autocomplete="off" placeholder="Tên của bạn"><button class="btn" id="saveNameBtn">Lưu tên</button></div></div>
  <div class="panel"><div class="leaderTitle"><strong>🏆 Top 10</strong><span>Firebase leaderboard</span></div><div class="leaderboard" id="leaderboard"></div></div>
  <div class="hint">PC: dùng phím mũi tên / WASD · Điện thoại: vuốt lên, xuống, trái, phải.</div>
</div>
<script>
const boardEl=document.getElementById('board'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),cover=document.getElementById('cover'),coverTitle=document.getElementById('coverTitle'),coverText=document.getElementById('coverText'),nameInput=document.getElementById('nameInput'),leaderboardEl=document.getElementById('leaderboard');
const GAME_ID='2048',NAME_KEY='playerName',BEST_KEY='best_2048',SAVE_KEY='game_2048';
let grid=Array(16).fill(0),score=0,previous=null,wonShown=false,gameOver=false,leaderboard=[];
let playerName='';try{playerName=localStorage.getItem(NAME_KEY)||'';nameInput.value=playerName;bestEl.textContent=localStorage.getItem(BEST_KEY)||'0'}catch(e){}
let fbRef=null;try{if(window.firebase&&typeof firebaseConfig!=='undefined'){if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);fbRef=firebase.database().ref('leaderboards/'+GAME_ID)}}catch(e){console.warn('Firebase unavailable',e)}
function addTile(){const empty=[];grid.forEach((v,i)=>{if(!v)empty.push(i)});if(!empty.length)return;const i=empty[Math.floor(Math.random()*empty.length)];grid[i]=Math.random()<.9?2:4}
function render(){boardEl.innerHTML='';grid.forEach(v=>{const el=document.createElement('div');el.className='tile'+(v>2048?' big':'');if(v){el.dataset.v=String(v);el.textContent=v}boardEl.appendChild(el)});scoreEl.textContent=score;const best=Math.max(Number(bestEl.textContent)||0,score);bestEl.textContent=best;try{localStorage.setItem(BEST_KEY,String(best));localStorage.setItem(SAVE_KEY,JSON.stringify({grid,score,wonShown,gameOver}))}catch(e){}}
function compress(line){const a=line.filter(Boolean),out=[];let gained=0;for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){out.push(a[i]*2);gained+=a[i]*2;i++}else out.push(a[i])}while(out.length<4)out.push(0);return{line:out,gained}}
function arraysEqual(a,b){return a.every((v,i)=>v===b[i])}
function move(dir){if(gameOver)return;previous={grid:grid.slice(),score,wonShown,gameOver};const before=grid.slice();let gained=0,next=Array(16).fill(0);for(let n=0;n<4;n++){let line=[];for(let k=0;k<4;k++){let r,c;if(dir==='left'){r=n;c=k}else if(dir==='right'){r=n;c=3-k}else if(dir==='up'){r=k;c=n}else{r=3-k;c=n}line.push(grid[r*4+c])}const res=compress(line);gained+=res.gained;for(let k=0;k<4;k++){let r,c;if(dir==='left'){r=n;c=k}else if(dir==='right'){r=n;c=3-k}else if(dir==='up'){r=k;c=n}else{r=3-k;c=n}next[r*4+c]=res.line[k]}}if(arraysEqual(before,next)){previous=null;return}grid=next;score+=gained;addTile();render();if(!wonShown&&grid.some(v=>v>=2048)){wonShown=true;showCover('🎉 2048!','Mày đã tới 2048. Có thể tiếp tục chơi.',true)}else if(!canMove()){finishGame()}}
function canMove(){if(grid.some(v=>!v))return true;for(let r=0;r<4;r++)for(let c=0;c<4;c++){const v=grid[r*4+c];if(c<3&&grid[r*4+c+1]===v)return true;if(r<3&&grid[(r+1)*4+c]===v)return true}return false}
function showCover(title,text,continueMode=false){coverTitle.textContent=title;coverText.textContent=text;cover.classList.add('show');document.getElementById('againBtn').textContent=continueMode?'Tiếp tục':'Chơi lại';document.getElementById('againBtn').onclick=()=>{cover.classList.remove('show');if(!continueMode)newGame()}}
function finishGame(){gameOver=true;render();submitScore();showCover('Game Over','Điểm của mày: '+score)}
function newGame(){grid=Array(16).fill(0);score=0;previous=null;wonShown=false;gameOver=false;cover.classList.remove('show');addTile();addTile();render()}
function undo(){if(!previous||gameOver)return;grid=previous.grid;score=previous.score;wonShown=previous.wonShown;gameOver=previous.gameOver;previous=null;render()}
function submitScore(){if(!fbRef||score<=0)return;const name=(nameInput.value||playerName||'Player').trim().slice(0,14)||'Player';fbRef.push({name,score,date:Date.now()}).then(prune).catch(()=>{})}
function prune(){if(!fbRef)return;fbRef.orderByChild('score').once('value',snap=>{const rows=[];snap.forEach(ch=>rows.push({key:ch.key,score:Number((ch.val()||{}).score||0)}));rows.sort((a,b)=>a.score-b.score);while(rows.length>10){const row=rows.shift();fbRef.child(row.key).remove()}})}
function renderLeaderboard(){leaderboardEl.innerHTML='';if(!leaderboard.length){leaderboardEl.innerHTML='<div class="empty">Chưa có điểm nào.</div>';return}leaderboard.forEach((r,i)=>{const el=document.createElement('div');el.className='row'+(playerName&&r.name===playerName?' me':'');const rank=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';el.innerHTML='<span>'+rank+'</span><span></span><strong></strong>';el.children[1].textContent=r.name;el.children[2].textContent=r.score;leaderboardEl.appendChild(el)})}
if(fbRef)fbRef.on('value',snap=>{const rows=[];snap.forEach(ch=>{const v=ch.val()||{};rows.push({name:v.name||'Player',score:Number(v.score||0),date:v.date||0})});rows.sort((a,b)=>b.score-a.score||a.date-b.date);leaderboard=rows.slice(0,10);renderLeaderboard()},()=>{leaderboardEl.innerHTML='<div class="empty">Không đọc được leaderboard.</div>'});else leaderboardEl.innerHTML='<div class="empty">Firebase chưa sẵn sàng.</div>';
document.getElementById('newBtn').onclick=newGame;document.getElementById('undoBtn').onclick=undo;document.getElementById('saveNameBtn').onclick=()=>{playerName=nameInput.value.trim().slice(0,14);if(!playerName){nameInput.focus();return}try{localStorage.setItem(NAME_KEY,playerName)}catch(e){}renderLeaderboard()};
window.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',A:'left',D:'right',W:'up',S:'down'};if(map[e.key]){e.preventDefault();move(map[e.key])}});
let sx=0,sy=0;boardEl.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;boardEl.setPointerCapture?.(e.pointerId)});boardEl.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
try{const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(saved&&Array.isArray(saved.grid)&&saved.grid.length===16&&!saved.gameOver){grid=saved.grid.map(Number);score=Number(saved.score)||0;wonShown=!!saved.wonShown;render()}else newGame()}catch(e){newGame()}
</script>
</body>
</html>
