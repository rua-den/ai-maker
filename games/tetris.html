<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Xếp Gạch — Rùa</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1f2e; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; }
  #loading { height: 100%; display: grid; place-items: center; font-weight: 700; opacity: .8; }
</style>
</head>
<body>
<div id="loading">Đang tải Xếp Gạch…</div>
<script>
(async () => {
  try {
    const response = await fetch('./tetris-core.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    let html = await response.text();

    const viewport = '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">';
    if (!/<meta\s+name=["\']viewport["\']/i.test(html)) {
      html = html.replace(/<head([^>]*)>/i, match => match + '\n' + viewport);
    }

    const mobilePatch = `
<style id="mobile-tetris-patch">
  html, body { overscroll-behavior: none; }
  @media (max-width: 720px), (max-height: 600px) {
    #touchControls {
      display: flex !important;
      bottom: calc(10px + env(safe-area-inset-bottom)) !important;
      gap: 8px !important;
      padding: 7px 8px;
      background: rgba(10,15,25,.45);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      backdrop-filter: blur(8px);
    }
    #touchControls button {
      width: 58px !important;
      height: 58px !important;
      font-size: 23px !important;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #overlay { padding-bottom: 92px; box-sizing: border-box; }
  }
  @media (max-width: 360px) {
    #touchControls { gap: 5px !important; padding: 6px; }
    #touchControls button { width: 54px !important; height: 54px !important; }
  }
</style>`;
    html = html.replace('</head>', mobilePatch + '\n</head>');

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.getElementById('loading').textContent = 'Không tải được Xếp Gạch. Hãy reload trang.';
    console.error('Tetris loader failed:', error);
  }
})();
</script>
</body>
</html>
