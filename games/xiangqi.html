<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cờ Tướng — Rùa</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#2b1d12; color:#fff; font-family:'Segoe UI',system-ui,sans-serif; }
  #loading { height:100%; display:grid; place-items:center; font-weight:800; opacity:.82; }
</style>
</head>
<body>
<div id="loading">Đang tải Cờ Tướng…</div>
<script>
(async () => {
  try {
    const response = await fetch('./xiangqi-core.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    let html = await response.text();
    if (!/<meta\s+name=["']viewport["']/i.test(html)) {
      html = html.replace('<meta charset="UTF-8">', '<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">');
    }
    html = html.replace('background: rgba(30, 20, 12, 0.75);\n    backdrop-filter: blur(4px);', 'background: rgba(30, 20, 12, 0.97);\n    backdrop-filter: blur(8px);');
    const css = `
<style id="xiangqi-online-style">
#setupPanel{width:min(430px,calc(100vw - 28px));max-height:min(640px,calc(100vh - 105px));overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(49,31,17,.99),rgba(28,18,11,.99));border:1px solid rgba(255,216,155,.3);box-shadow:0 18px 48px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
#onlineOptions{width:100%;display:flex;flex-direction:column;gap:10px;align-items:stretch}.playerField{display:flex;flex-direction:column;gap:6px;width:100%}.playerField label{font-size:12px;font-weight:800;opacity:.9}.playerInput{width:100%;border:2px solid rgba(255,255,255,.18);border-radius:9px;padding:10px 11px;outline:none;background:#fff8ec;color:#2c1a0c;font-size:15px;font-weight:800;text-align:center}.playerInput:focus{border-color:#f1a54b;box-shadow:0 0 0 3px rgba(241,165,75,.18)}
.onlineActionRow{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%}.onlinePrimary,.onlineSecondary{border:0;border-radius:9px;padding:10px 12px;font-size:14px;font-weight:900;cursor:pointer}.onlinePrimary{background:linear-gradient(180deg,#70dc7d,#45bb54);color:#0b3610;box-shadow:0 3px 0 #287a35}.onlineSecondary{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}#onlineStatus{min-height:18px;font-size:12px;line-height:1.4;text-align:center;color:#ffd79a}#lobbyHeader{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}#refreshRoomsBtn{border:0;background:transparent;color:#ffd79a;font-weight:800;cursor:pointer;padding:4px 6px}#roomList{width:100%;display:flex;flex-direction:column;gap:7px;max-height:220px;overflow:auto}.roomRow{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.08)}.roomInfo{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;text-align:left}.roomName{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roomMeta{font-size:11px;opacity:.68}.joinRoomBtn{border:0;border-radius:8px;padding:8px 11px;background:#e8a33d;color:#3a1e00;font-weight:900;cursor:pointer}.joinRoomBtn:disabled{opacity:.45;cursor:default}.roomEmpty{padding:14px 8px;text-align:center;font-size:12px;opacity:.65}#onlineBadge{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:none;z-index:21;border-radius:999px;padding:7px 13px;background:rgba(24,15,9,.88);border:1px solid rgba(255,255,255,.15);color:#ffd79a;font-size:12px;font-weight:800}
@media(max-width:520px){#menuOverlay{gap:10px;padding:62px 10px 14px;overflow:auto;justify-content:flex-start}#menuOverlay h1{font-size:29px;margin-top:5px}#setupPanel{width:min(410px,calc(100vw - 20px));max-height:calc(100vh - 92px);padding:12px 13px;gap:10px}.choiceBtn{padding:10px 12px;font-size:13px}.onlineActionRow{grid-template-columns:1fr}#topBar{top:62px;gap:7px;max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center}#topBar button{padding:7px 9px}}
</style>`;
    const scripts = '<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"><\/script>\n<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"><\/script>\n<script src="../firebase-config.js"><\/script>';
    html = html.replace('</head>', css + '\n' + scripts + '\n</head>');
    html = html.replace('</body>', '<script src="./xiangqi-online.js"><\/script>\n<script src="./xiangqi-room-controls.js"><\/script>\n<script src="./xiangqi-presence.js"><\/script>\n<script src="./xiangqi-enhancements.js"><\/script>\n<script src="./xiangqi-live.js"><\/script>\n<script src="./xiangqi-suggestion-reset.js"><\/script>\n<script src="./xiangqi-live-chat.js"><\/script>\n<script src="./xiangqi-match-ui.js"><\/script>\n<script src="./xiangqi-board-center-fix.js"><\/script>\n</body>');
    document.open(); document.write(html); document.close();
  } catch (error) {
    document.getElementById('loading').textContent = 'Không tải được Cờ Tướng. Hãy reload trang.';
    console.error('Xiangqi loader failed:', error);
  }
})();
</script>
</body>
</html>
