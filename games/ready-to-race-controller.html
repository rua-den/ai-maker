<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ready to Race — Controller</title>
<link rel="stylesheet" href="../assets/app-fonts.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#060c12;color:#f7fbff;overscroll-behavior:none;overflow:hidden;touch-action:none}body{background:radial-gradient(circle at 50% -10%,#29455f,#0d1d2b 48%,#050a0f)}button,input{font:inherit}.app{width:100%;height:100dvh;display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.lobby{width:min(540px,100%);max-height:100%;overflow:auto;background:rgba(9,19,29,.94);border:1px solid rgba(255,255,255,.11);border-radius:24px;padding:18px;box-shadow:0 20px 70px rgba(0,0,0,.4)}.lobby.hide{display:none}h1{margin:0;text-align:center;font-size:40px}.sub{text-align:center;opacity:.58;font-size:10px;font-weight:900;letter-spacing:.14em;margin:2px 0 13px}.fields{display:grid;grid-template-columns:1fr .72fr;gap:10px}.field label,.vehicleTitle{display:block;font-size:10px;font-weight:950;letter-spacing:.11em;margin:0 0 5px;color:#78d7ff}.field input{width:100%;border:2px solid rgba(255,255,255,.13);border-radius:13px;padding:11px 12px;background:#f8fbff;color:#102b3a;font-size:17px;font-weight:900;outline:0;text-align:center}.roomInput{text-transform:uppercase;letter-spacing:.18em}.vehicleTitle{margin-top:12px}.vehicleGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.vehicleChoice{border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:9px 5px;background:rgba(255,255,255,.055);color:#eaf7ff;font-size:10px;font-weight:900;line-height:1.15;cursor:pointer}.vehicleChoice strong{display:block;font-size:25px;margin-bottom:4px}.vehicleChoice.selected{background:#173e50;border-color:#71e4ff;box-shadow:0 0 0 2px rgba(113,228,255,.17)}.join{margin-top:11px;width:100%;border:0;border-radius:14px;padding:13px;background:#71e4ff;color:#062d3a;font-size:16px;font-weight:1000;box-shadow:0 5px 0 #277f98}.join:active{transform:translateY(3px);box-shadow:0 2px 0 #277f98}.msg{min-height:18px;margin-top:8px;text-align:center;font-size:11px;font-weight:850;color:#ffe077}.backCreate{display:block;text-align:center;margin-top:7px;color:#a7dfff;font-size:10px;font-weight:850;text-decoration:none;opacity:.8}.play{display:none;position:relative;width:100%;height:100%;min-width:0}.play.show{display:block}.gamepad{width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(150px,.56fr) minmax(0,.96fr);gap:10px}.zone,.hud{min-width:0;border:1px solid rgba(255,255,255,.1);background:rgba(8,18,28,.88);border-radius:22px;overflow:hidden}.zoneLabel{height:30px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:1000;letter-spacing:.16em;opacity:.52}.steeringZone{display:grid;grid-template-rows:30px 1fr}.steeringButtons{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px 10px}.steerBtn,.pedal{border:0;color:#fff;font-weight:1000;touch-action:none;user-select:none;min-width:0}.steerBtn{height:100%;border-radius:18px;background:linear-gradient(180deg,#3b5d78,#1a3043);font-size:clamp(48px,9vw,84px);box-shadow:inset 0 -7px 0 rgba(0,0,0,.28)}.steerBtn.active{transform:translateY(3px);background:linear-gradient(180deg,#5d8fb5,#2b506a);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28)}.pedalZone{display:grid;grid-template-rows:30px .26fr .26fr .48fr;gap:8px;padding-bottom:10px}.pedalZone .zoneLabel{margin-bottom:-8px}.pedal{margin:0 10px;border-radius:18px;font-size:clamp(16px,3.4vw,28px);box-shadow:inset 0 -7px 0 rgba(0,0,0,.28)}.reverse{background:linear-gradient(180deg,#7d89a0,#454f62)}.brake{background:linear-gradient(180deg,#ff7373,#b52f3f)}.gas{background:linear-gradient(180deg,#9cf277,#43bf5b);font-size:clamp(25px,4.8vw,42px)}.pedal.active{transform:translateY(3px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28)}.disabled{filter:grayscale(.72);opacity:.38}.hud{display:flex;flex-direction:column;align-items:stretch;justify-content:center;padding:10px;text-align:center}.topline{display:flex;justify-content:space-between;gap:6px}.badge,.place,.vehicleBadge{padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);font-size:10px;font-weight:950;white-space:nowrap}.place{color:#ffe16b}.vehicleBadge{margin-top:6px;color:#9eeeff}.driver{font-size:clamp(17px,3vw,27px);font-weight:1000;margin:7px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{font-size:10px;line-height:1.25;opacity:.67;font-weight:800;min-height:24px;display:grid;place-items:center}.dash{display:grid;grid-template-columns:1fr;gap:5px;margin:6px 0}.dash div{padding:6px 5px;border-radius:11px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07)}.dash strong{display:block;font-size:clamp(16px,3.2vw,26px);line-height:1}.dash span{font-size:8px;opacity:.5;font-weight:950;letter-spacing:.1em}.leave{margin-top:2px;border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:7px;background:transparent;color:#d9edf6;font-size:10px;font-weight:850}.rotateOverlay{display:none;position:absolute;inset:0;z-index:20;background:#071018;place-items:center;text-align:center;padding:28px}.rotateBox{max-width:310px}.rotateIcon{font-size:64px}.rotateBox strong{display:block;font-size:24px;margin:8px 0}.rotateBox p{margin:0;opacity:.62;font-size:13px;line-height:1.5}@media(orientation:portrait){.play.show .rotateOverlay{display:grid}}@media(max-height:430px) and (orientation:landscape){.gamepad{gap:7px}.zone,.hud{border-radius:16px}.steeringButtons{gap:7px;padding:0 7px 7px}.pedalZone{gap:5px;padding-bottom:7px}.pedal{margin:0 7px}.zoneLabel{height:24px;font-size:8px}.steeringZone{grid-template-rows:24px 1fr}.pedalZone{grid-template-rows:24px .24fr .24fr .52fr}.hud{padding:7px}.driver{margin:4px 0 0}.dash{margin:4px 0;gap:3px}.dash div{padding:4px}.leave{padding:5px}.state{min-height:18px;font-size:9px}.vehicleBadge{margin-top:3px;padding:4px 6px}}@media(max-width:620px) and (orientation:portrait){.fields{grid-template-columns:1fr}.lobby{padding:14px}.vehicleGrid{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="ready-to-race-core.js"></script>
</head>
<body>
<main class="app">
  <section id="lobby" class="lobby">
    <h1>🏎️</h1>
    <div class="sub">READY TO RACE · PHONE CONTROLLER</div>
    <div class="fields">
      <div class="field"><label>TÊN TAY ĐUA</label><input id="name" maxlength="16" autocomplete="nickname" placeholder="Ví dụ: Rùa Đen"></div>
      <div class="field"><label>MÃ PHÒNG</label><input id="room" class="roomInput" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD"></div>
    </div>
    <div class="vehicleTitle">CHỌN XE</div>
    <div id="vehicleGrid" class="vehicleGrid">
      <button type="button" class="vehicleChoice" data-vehicle="roach"><strong>🪳</strong>XE GIÁN</button>
      <button type="button" class="vehicleChoice" data-vehicle="tank"><strong>🛡️</strong>XE TANK</button>
      <button type="button" class="vehicleChoice selected" data-vehicle="normal"><strong>🚗</strong>XE THƯỜNG</button>
      <button type="button" class="vehicleChoice" data-vehicle="race"><strong>🏎️</strong>XE ĐUA</button>
    </div>
    <button id="join" class="join">VÀO PHÒNG</button>
    <div id="msg" class="msg"></div>
    <a class="backCreate" href="ready-to-race-start.html">← Chọn lại: Tạo phòng / Vào phòng</a>
  </section>

  <section id="play" class="play">
    <div class="gamepad">
      <section class="zone steeringZone"><div class="zoneLabel">STEERING</div><div class="steeringButtons"><button id="left" class="steerBtn" type="button" aria-label="Rẽ trái">◀</button><button id="right" class="steerBtn" type="button" aria-label="Rẽ phải">▶</button></div></section>
      <section class="hud">
        <div class="topline"><div id="badge" class="badge">ROOM ····</div><div id="place" class="place">#–</div></div>
        <div id="vehicleBadge" class="vehicleBadge">🚗 XE THƯỜNG</div>
        <div id="driver" class="driver">Racer</div><div id="state" class="state">Đang kết nối…</div>
        <div class="dash"><div><strong id="lap">1 / 3</strong><span>LAP</span></div><div><strong id="speed">0</strong><span>KM/H</span></div></div>
        <button id="leave" class="leave" type="button">RỜI PHÒNG</button>
      </section>
      <section class="zone pedalZone"><div class="zoneLabel">PEDALS</div><button id="reverse" class="pedal reverse" type="button">REVERSE</button><button id="brake" class="pedal brake" type="button">BRAKE</button><button id="gas" class="pedal gas" type="button">GAS</button></section>
    </div>
    <div class="rotateOverlay" aria-live="polite"><div class="rotateBox"><div class="rotateIcon">📱↻</div><strong>Xoay ngang điện thoại</strong><p>Tay cầm Ready to Race được thiết kế cho landscape.</p></div></div>
  </section>
</main>
<script>
(()=>{
  const C=window.ReadyToRaceCore;
  const lobby=document.getElementById('lobby'),play=document.getElementById('play'),nameEl=document.getElementById('name'),roomEl=document.getElementById('room'),joinBtn=document.getElementById('join'),msgEl=document.getElementById('msg'),badgeEl=document.getElementById('badge'),vehicleBadgeEl=document.getElementById('vehicleBadge'),driverEl=document.getElementById('driver'),stateEl=document.getElementById('state'),placeEl=document.getElementById('place'),lapEl=document.getElementById('lap'),speedEl=document.getElementById('speed'),leftBtn=document.getElementById('left'),rightBtn=document.getElementById('right'),gasBtn=document.getElementById('gas'),brakeBtn=document.getElementById('brake'),reverseBtn=document.getElementById('reverse'),leaveBtn=document.getElementById('leave'),vehicleButtons=[...document.querySelectorAll('.vehicleChoice')];
  let db=null,roomRef=null,playerRef=null,disconnectOp=null,roomState=null,currentCode='',joined=false,seq=0,sendTimer=null;
  let steer=0,throttle=0,brake=false,reverse=false,clientId='',selectedVehicle='normal';
  const queryCode=C.cleanRoomCode(new URLSearchParams(location.search).get('room'));
  try{clientId=localStorage.getItem('readyToRaceClientId')||'';if(!clientId){clientId=(crypto.randomUUID?.()||('p'+Date.now()+Math.random())).replace(/[^a-z0-9]/gi,'').slice(0,32);localStorage.setItem('readyToRaceClientId',clientId)}nameEl.value=localStorage.getItem('readyToRaceName')||'';selectedVehicle=C.sanitizeVehicle(localStorage.getItem('readyToRaceVehicle')||'normal')}catch(e){clientId='p'+Date.now()+Math.random()}
  if(queryCode)roomEl.value=queryCode;

  function message(text){msgEl.textContent=text||''}
  function selectVehicle(value){selectedVehicle=C.sanitizeVehicle(value);for(const b of vehicleButtons)b.classList.toggle('selected',b.dataset.vehicle===selectedVehicle);const spec=C.vehicleSpec(selectedVehicle);vehicleBadgeEl.textContent=spec.emoji+' '+spec.label.toUpperCase();try{localStorage.setItem('readyToRaceVehicle',selectedVehicle)}catch(e){}}
  function setControls(enabled){for(const b of [leftBtn,rightBtn,gasBtn,brakeBtn,reverseBtn])b.classList.toggle('disabled',!enabled)}
  function init(){selectVehicle(selectedVehicle);try{if(!window.firebase||typeof firebaseConfig==='undefined')throw new Error('firebase_missing');if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.database();message(queryCode?'Chọn xe, nhập tên rồi vào phòng '+queryCode+'.':'Nhập tên, mã phòng và chọn xe.')}catch(e){console.error(e);message('Không kết nối được Firebase. Kiểm tra mạng rồi reload.')}}
  function requestLandscape(){try{const p=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');if(p&&typeof p.catch==='function')p.catch(()=>{})}catch(e){}}
  async function joinRoom(){if(!db)return message('Firebase chưa sẵn sàng.');requestLandscape();const code=C.cleanRoomCode(roomEl.value),name=C.cleanName(nameEl.value);if(code.length!==4)return message('Mã phòng gồm 4 ký tự.');nameEl.value=name;roomEl.value=code;try{localStorage.setItem('readyToRaceName',name)}catch(e){}joinBtn.disabled=true;message('Đang vào garage…');const ref=db.ref(`${C.ROOT}/${C.roomKey(code)}`);try{const snap=await ref.once('value'),room=snap.val();if(!room||room.kind!==C.ROOM_KIND)throw new Error('room_not_found');if(room.status!=='race_waiting')throw new Error('race_started');const players=room.players||{},existing=players[clientId];if(!existing&&Object.keys(players).length>=C.MAX_PLAYERS)throw new Error('room_full');const pRef=ref.child('players/'+clientId);await pRef.set({name,vehicle:selectedVehicle,joinedAt:firebase.database.ServerValue.TIMESTAMP,input:{steer:0,throttle:0,brake:false,reverse:false,seq:0,at:firebase.database.ServerValue.TIMESTAMP}});roomRef=ref;playerRef=pRef;currentCode=code;joined=true;disconnectOp=playerRef.onDisconnect();await disconnectOp.remove();roomRef.on('value',handleRoom,()=>showLobby('Mất quyền đọc phòng.'));lobby.classList.add('hide');play.classList.add('show');badgeEl.textContent='ROOM '+code;driverEl.textContent=name;selectVehicle(selectedVehicle);startSending();message('')}catch(e){console.error(e);if(e.message==='room_full')message('Phòng đã đủ '+C.MAX_PLAYERS+' người.');else if(e.message==='race_started')message('Ván này đã bắt đầu. Chờ host cho đua lại.');else if(e.message==='room_not_found')message('Không thấy phòng '+code+'.');else message('Không vào được phòng. Thử lại.')}finally{joinBtn.disabled=false}}
  function showLobby(text){joined=false;stopSending();resetInput();play.classList.remove('show');lobby.classList.remove('hide');if(text)message(text)}
  function handleRoom(snap){const room=snap.val();roomState=room;if(!room||room.kind!==C.ROOM_KIND){detach(false);showLobby('Màn hình chính đã đóng phòng.');return}const mine=room.players&&room.players[clientId];if(!mine){detach(false);showLobby('Bạn không còn trong phòng.');return}selectedVehicle=C.sanitizeVehicle(mine.vehicle);selectVehicle(selectedVehicle);driverEl.textContent=C.cleanName(mine.name);const tel=room.telemetry&&room.telemetry[clientId];placeEl.textContent=tel?.place?'#'+tel.place:'#–';lapEl.textContent=(tel?.lap||1)+' / '+C.LAPS;const signedSpeed=Math.round(Number(tel?.speed)||0);speedEl.textContent=Math.abs(signedSpeed);if(room.status==='race_waiting'){stateEl.textContent='CHỜ HOST START';setControls(false)}else if(room.status==='race_countdown'){stateEl.textContent='READY… GIỮ GAS!';setControls(true)}else if(room.status==='race_playing'){stateEl.textContent=signedSpeed<0?'REVERSE':'RACE!';setControls(true)}else if(room.status==='race_finished'){setControls(false);resetInput();const winner=room.players&&room.players[room.winner];stateEl.textContent=room.winner===clientId?'🏆 BẠN THẮNG!':winner?'🏁 '+C.cleanName(winner.name)+' thắng':'🏁 FINISH'}}
  function startSending(){stopSending();sendTimer=setInterval(sendInput,80)}function stopSending(){if(sendTimer)clearInterval(sendTimer);sendTimer=null}
  function sendInput(){if(!joined||!playerRef||!roomState)return;const active=roomState.status==='race_countdown'||roomState.status==='race_playing';const payload={steer:active?steer:0,throttle:active?throttle:0,brake:active?brake:false,reverse:active?reverse:false,seq:++seq,at:firebase.database.ServerValue.TIMESTAMP};playerRef.child('input').set(payload).catch(()=>{})}
  function resetInput(){steer=0;throttle=0;brake=false;reverse=false;for(const b of [leftBtn,rightBtn,gasBtn,brakeBtn,reverseBtn])b.classList.remove('active')}
  function bindHold(button,onStart,onEnd){const active=new Set();button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture?.(e.pointerId);active.add(e.pointerId);button.classList.add('active');onStart()});const end=e=>{if(!active.has(e.pointerId))return;active.delete(e.pointerId);if(!active.size){button.classList.remove('active');onEnd()}};button.addEventListener('pointerup',end);button.addEventListener('pointercancel',end);button.addEventListener('lostpointercapture',end)}
  bindHold(leftBtn,()=>{steer=-1},()=>{steer=rightBtn.classList.contains('active')?1:0});bindHold(rightBtn,()=>{steer=1},()=>{steer=leftBtn.classList.contains('active')?-1:0});bindHold(gasBtn,()=>{throttle=1;reverse=false;reverseBtn.classList.remove('active')},()=>{throttle=0});bindHold(brakeBtn,()=>{brake=true},()=>{brake=false});bindHold(reverseBtn,()=>{reverse=true;throttle=0;gasBtn.classList.remove('active')},()=>{reverse=false});
  async function detach(remove=true){joined=false;stopSending();resetInput();if(roomRef)roomRef.off();if(disconnectOp)try{await disconnectOp.cancel()}catch(e){}if(remove&&playerRef)try{await playerRef.remove()}catch(e){}roomRef=playerRef=disconnectOp=null;roomState=null;currentCode=''}
  async function leave(){await detach(true);showLobby('Đã rời phòng.')}
  for(const button of vehicleButtons)button.addEventListener('click',()=>selectVehicle(button.dataset.vehicle));joinBtn.addEventListener('click',joinRoom);nameEl.addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom()});roomEl.addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom()});leaveBtn.addEventListener('click',leave);document.addEventListener('contextmenu',e=>e.preventDefault());window.ReadyToRaceController={getState:()=>({code:currentCode,roomState,steer,throttle,brake,reverse,vehicle:selectedVehicle}),join:joinRoom};init();
})();
</script>
</body>
</html>
