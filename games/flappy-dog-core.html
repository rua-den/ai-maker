<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flappy Dog</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #31aee9;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    touch-action: manipulation;
  }
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    display: block;
    cursor: pointer;
    box-shadow: 0 0 50px rgba(16, 55, 83, .28);
  }
  #gameBadge, .roundBtn {
    position: fixed;
    z-index: 30;
    top: 14px;
    height: 42px;
    border: 2px solid rgba(255,255,255,.36);
    background: linear-gradient(180deg, rgba(24,72,116,.95), rgba(16,48,82,.95));
    box-shadow: 0 4px 0 rgba(7,30,55,.45), 0 7px 20px rgba(0,0,0,.18);
    color: #fff;
    text-decoration: none;
    backdrop-filter: blur(6px);
  }
  #gameBadge {
    left: 14px;
    border-radius: 24px;
    padding: 0 16px 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: .5px;
  }
  #gameBadge .paw {
    width: 29px;
    height: 29px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,.14);
    font-size: 17px;
  }
  .roundBtn {
    width: 42px;
    padding: 0;
    border-radius: 13px;
    display: grid;
    place-items: center;
    cursor: pointer;
    font-size: 17px;
    font-weight: 900;
  }
  #fullscreenBtn { right: 14px; }
  #pauseBtn { right: 64px; }
  #gameBadge:active, .roundBtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(7,30,55,.45); }

  #scoreDisplay {
    position: absolute;
    z-index: 15;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    color: white;
    font-size: 50px;
    line-height: 1;
    font-weight: 1000;
    -webkit-text-stroke: 3px #193b58;
    paint-order: stroke fill;
    text-shadow: 0 5px 0 rgba(10,52,83,.28);
    pointer-events: none;
  }

  #overlay {
    position: absolute;
    z-index: 20;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    color: #fff;
    text-align: center;
    padding: 72px 16px 24px;
    text-shadow: 0 3px 6px rgba(0,0,0,.35);
  }
  #titleText {
    font-size: clamp(28px, 7vw, 46px);
    font-weight: 1000;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }
  #subText {
    font-size: clamp(13px, 2.7vw, 17px);
    font-weight: 700;
    opacity: .96;
    max-width: 330px;
  }
  .panel {
    pointer-events: auto;
    background: rgba(19, 56, 80, .72);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.22);
    backdrop-filter: blur(8px);
  }
  #nameEntry {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    padding: 10px;
  }
  #nameInput {
    width: 148px;
    border: 2px solid rgba(255,255,255,.55);
    border-radius: 9px;
    padding: 9px 11px;
    outline: none;
    background: rgba(255,255,255,.96);
    color: #183248;
    font-weight: 800;
    text-align: center;
    font-size: 15px;
  }
  #nameInput:focus { border-color: #ffd86a; }
  #nameInput.shakeError { animation: shake .35s; border-color: #ff756d; }
  @keyframes shake {
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  #startBtn {
    border: 0;
    border-radius: 9px;
    padding: 9px 17px;
    background: linear-gradient(#fff099,#ffc544);
    box-shadow: 0 3px 0 #b77c17;
    color: #573a00;
    font-size: 15px;
    font-weight: 1000;
    cursor: pointer;
  }
  #startBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b77c17; }

  #leaderboardBox {
    margin-top: 14px;
    width: min(270px, 82vw);
    padding: 11px 14px;
  }
  #lbTitle { font-size: 15px; font-weight: 1000; margin-bottom: 7px; }
  #leaderboardList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-height: 160px;
    overflow-y: auto;
  }
  .lbRow {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 4px 7px;
    border-radius: 7px;
    background: rgba(255,255,255,.08);
    font-size: 13px;
    font-weight: 750;
  }
  .lbHighlight { background: rgba(255,216,106,.32); outline: 1px solid rgba(255,216,106,.55); }
  .lbRank { width: 27px; flex: 0 0 27px; }
  .lbName { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lbScore { font-weight: 1000; }
  .lbEmpty { padding: 6px; font-size: 13px; opacity: .85; }
  #lbActions { display: flex; gap: 6px; margin-top: 8px; }
  #lbActions button {
    flex: 1;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 7px;
    background: rgba(255,255,255,.11);
    color: white;
    padding: 6px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }

  @media (max-width: 500px) {
    #gameBadge { font-size: 11px; padding-right: 11px; }
    #gameBadge .paw { width: 27px; height: 27px; }
    .roundBtn { width: 39px; height: 39px; }
    #pauseBtn { right: 60px; }
    #scoreDisplay { top: 70px; }
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
</head>
<body>
<div id="gameContainer">
  <a id="gameBadge" href="../index.html" title="Back to game portfolio">
    <span class="paw">🐾</span><span>FLAPPY DOG</span>
  </a>
  <button id="pauseBtn" class="roundBtn" title="Pause" aria-label="Pause">Ⅱ</button>
  <button id="fullscreenBtn" class="roundBtn" title="Fullscreen" aria-label="Fullscreen">⛶</button>

  <canvas id="game" width="400" height="600"></canvas>
  <div id="scoreDisplay">0</div>

  <div id="overlay">
    <div id="titleText">🐶 FLAPPY DOG</div>
    <div id="subText">Fly through the bones — click, tap, or press Space.</div>

    <div id="nameEntry" class="panel">
      <input id="nameInput" type="text" maxlength="14" placeholder="Your name" autocomplete="off">
      <button id="startBtn">▶ Play</button>
    </div>

    <div id="leaderboardBox" class="panel">
      <div id="lbTitle">🏆 Top 10</div>
      <ol id="leaderboardList"></ol>
      <div id="lbActions">
        <button id="exportBtn">⬇ Export</button>
        <button id="importBtn">⬆ Import</button>
        <input id="importFile" type="file" accept="application/json" hidden>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 400;
const H = 600;
const groundHeight = 86;

const overlay = document.getElementById('overlay');
const titleText = document.getElementById('titleText');
const subText = document.getElementById('subText');
const nameEntry = document.getElementById('nameEntry');
const leaderboardBox = document.getElementById('leaderboardBox');
const leaderboardList = document.getElementById('leaderboardList');
const nameInput = document.getElementById('nameInput');
const startBtn = document.getElementById('startBtn');
const scoreDisplay = document.getElementById('scoreDisplay');
const pauseBtn = document.getElementById('pauseBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const importFile = document.getElementById('importFile');

function setupCanvas() {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
setupCanvas();
window.addEventListener('resize', setupCanvas);
window.addEventListener('orientationchange', setupCanvas);

fullscreenBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.().catch(() => {});
  } else {
    document.exitFullscreen?.();
  }
});
document.addEventListener('fullscreenchange', () => {
  fullscreenBtn.textContent = document.fullscreenElement ? '✕' : '⛶';
  setupCanvas();
});

const dogSprite = new Image();
dogSprite.src = '../assets/flappy-dog-corgi.webp';

const GAME_ID = 'flappy-dog';
const LB_KEY = 'leaderboard_' + GAME_ID;
const NAME_KEY = 'playerName';
const USE_FIREBASE = !!(
  typeof firebaseConfig !== 'undefined' &&
  firebaseConfig.apiKey &&
  firebaseConfig.apiKey !== 'YOUR_API_KEY' &&
  window.firebase
);

let fbRef = null;
if (USE_FIREBASE) {
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    fbRef = firebase.database().ref('leaderboards/' + GAME_ID);
  } catch (err) {
    console.warn('Firebase unavailable; using local leaderboard.', err);
  }
}

let leaderboard = [];
let playerName = '';

function localLoad() {
  try {
    const value = JSON.parse(localStorage.getItem(LB_KEY));
    return Array.isArray(value) ? value : [];
  } catch { return []; }
}
function localSave() {
  try { localStorage.setItem(LB_KEY, JSON.stringify(leaderboard)); } catch {}
}
function escapeHtml(value) {
  const div = document.createElement('div');
  div.textContent = String(value ?? '');
  return div.innerHTML;
}
function renderLeaderboard(highlight) {
  leaderboardList.innerHTML = '';
  if (!leaderboard.length) {
    leaderboardList.innerHTML = '<li class="lbEmpty">No scores yet — be the first!</li>';
    return;
  }
  leaderboard.forEach((entry, index) => {
    const li = document.createElement('li');
    const hit = highlight && entry.name === highlight.name && entry.score === highlight.score;
    li.className = 'lbRow' + (hit ? ' lbHighlight' : '');
    const rank = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index + 1) + '.';
    li.innerHTML =
      '<span class="lbRank">' + rank + '</span>' +
      '<span class="lbName">' + escapeHtml(entry.name) + '</span>' +
      '<span class="lbScore">' + Number(entry.score || 0) + '</span>';
    leaderboardList.appendChild(li);
  });
}
function trimLeaderboard() {
  leaderboard.sort((a, b) => b.score - a.score || (a.date || 0) - (b.date || 0));
  leaderboard = leaderboard.slice(0, 10);
}
function pruneFirebase() {
  if (!fbRef) return;
  fbRef.orderByChild('score').once('value', snap => {
    const rows = [];
    snap.forEach(child => rows.push({ key: child.key, score: Number(child.val()?.score || 0) }));
    if (rows.length > 10) rows.slice(0, rows.length - 10).forEach(row => fbRef.child(row.key).remove());
  });
}
function addScore(name, value) {
  const entry = { name, score: value, date: Date.now() };
  let rank = leaderboard.findIndex(row => value > row.score);
  if (rank < 0) rank = leaderboard.length;
  const madeTop10 = rank < 10;

  if (fbRef) {
    fbRef.push(entry).then(pruneFirebase);
  } else {
    leaderboard.push(entry);
    trimLeaderboard();
    localSave();
  }
  return { entry, rank, madeTop10 };
}

if (fbRef) {
  fbRef.on('value', snap => {
    const rows = [];
    snap.forEach(child => {
      const row = child.val() || {};
      rows.push({ key: child.key, name: row.name || 'Player', score: Number(row.score || 0), date: row.date || 0 });
    });
    leaderboard = rows;
    trimLeaderboard();
    renderLeaderboard();
  });
} else {
  leaderboard = localLoad();
  trimLeaderboard();
  renderLeaderboard();
}

try { nameInput.value = localStorage.getItem(NAME_KEY) || ''; } catch {}

exportBtn.addEventListener('click', e => {
  e.stopPropagation();
  const blob = new Blob([JSON.stringify(leaderboard, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = GAME_ID + '-leaderboard.json';
  a.click();
  URL.revokeObjectURL(url);
});
importBtn.addEventListener('click', e => {
  e.stopPropagation();
  importFile.value = '';
  importFile.click();
});
importFile.addEventListener('change', () => {
  const file = importFile.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const rows = JSON.parse(reader.result);
      if (!Array.isArray(rows)) throw new Error('Invalid leaderboard');
      const valid = rows.filter(r => r && typeof r.name === 'string' && Number.isFinite(Number(r.score)))
        .map(r => ({ name: r.name.slice(0,14), score: Number(r.score), date: r.date || Date.now() }));
      if (fbRef) {
        valid.forEach(row => fbRef.push(row));
        pruneFirebase();
      } else {
        leaderboard.push(...valid);
        trimLeaderboard();
        localSave();
        renderLeaderboard();
      }
      subText.textContent = 'Leaderboard imported and merged!';
    } catch {
      subText.textContent = 'Could not read that leaderboard file.';
    }
  };
  reader.readAsText(file);
});

let state = 'ready';
let frame = 0;
let clockTime = 0;
let score = 0;
let best = 0;
let deadFrame = 0;
let shake = 0;

const dog = {
  x: 104,
  y: H / 2,
  vy: 0,
  radius: 17,
  rotation: 0,
  flapPhase: 0
};
const GRAVITY = 0.43;
const FLAP = -8.15;
const MAX_FALL = 10;

let obstacles = [];
let obstacleTimer = 0;
const BONE_GAP = 166;
const BONE_WIDTH = 68;
const BONE_SPEED = 2.65;
const BONE_INTERVAL = 108;

let particles = [];
let groundOffset = 0;

const clouds = Array.from({ length: 7 }, () => ({
  x: Math.random() * W,
  y: 45 + Math.random() * 190,
  scale: .55 + Math.random() * .75,
  speed: .12 + Math.random() * .2
}));

const hills = Array.from({ length: 6 }, (_, i) => ({
  x: i * 100 - 40,
  w: 145 + Math.random() * 35,
  h: 55 + Math.random() * 35
}));

function spawnFlapParticles() {
  for (let i = 0; i < 7; i++) {
    particles.push({
      x: dog.x - 23,
      y: dog.y + (Math.random() - .5) * 14,
      vx: -1.2 - Math.random() * 1.5,
      vy: (Math.random() - .5) * 1.2,
      life: 25,
      maxLife: 25,
      size: 1.5 + Math.random() * 2.5,
      color: '#ffffff'
    });
  }
}
function spawnDeathBurst() {
  const colors = ['#fff5c9', '#f6b34a', '#ffffff', '#ff7f6e'];
  for (let i = 0; i < 28; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1.8 + Math.random() * 4;
    particles.push({
      x: dog.x, y: dog.y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 42, maxLife: 42,
      size: 2 + Math.random() * 3,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}
function updateParticles(m) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * m;
    p.y += p.vy * m;
    p.vy += .045 * m;
    p.life -= m;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function spawnObstacle() {
  const margin = 58;
  const topH = margin + Math.random() * (H - groundHeight - BONE_GAP - margin * 2);
  obstacles.push({ x: W + 20, topH, passed: false });
}
function updateObstacles(m) {
  obstacleTimer += m;
  if (obstacleTimer >= BONE_INTERVAL) {
    obstacleTimer = 0;
    spawnObstacle();
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= BONE_SPEED * m;

    if (!o.passed && o.x + BONE_WIDTH < dog.x) {
      o.passed = true;
      score++;
      scoreDisplay.textContent = score;
      scoreDisplay.animate(
        [{ transform: 'translateX(-50%) scale(1)' }, { transform: 'translateX(-50%) scale(1.25)' }, { transform: 'translateX(-50%) scale(1)' }],
        { duration: 170, easing: 'ease-out' }
      );
    }

    const br = dog.radius * .88;
    if (dog.x + br > o.x && dog.x - br < o.x + BONE_WIDTH) {
      if (dog.y - br < o.topH || dog.y + br > o.topH + BONE_GAP) die();
    }

    if (o.x + BONE_WIDTH < -25) obstacles.splice(i, 1);
  }
}

function startGame() {
  state = 'playing';
  overlay.style.display = 'none';
  scoreDisplay.style.display = 'block';
  pauseBtn.textContent = 'Ⅱ';
}
function tryStartGame() {
  const name = nameInput.value.trim();
  if (!name) {
    nameInput.classList.remove('shakeError');
    void nameInput.offsetWidth;
    nameInput.classList.add('shakeError');
    nameInput.focus();
    subText.textContent = 'Please enter your name to play!';
    return;
  }
  playerName = name.slice(0, 14);
  try { localStorage.setItem(NAME_KEY, playerName); } catch {}
  startGame();
}
function resetGame() {
  dog.y = H / 2;
  dog.vy = 0;
  dog.rotation = 0;
  obstacles = [];
  obstacleTimer = 45;
  particles = [];
  score = 0;
  scoreDisplay.textContent = '0';
  scoreDisplay.style.display = 'none';
  state = 'ready';
  overlay.style.display = 'flex';
  nameEntry.style.display = 'flex';
  leaderboardBox.style.display = 'block';
  titleText.textContent = '🐶 FLAPPY DOG';
  subText.textContent = 'Fly through the bones — click, tap, or press Space.';
  pauseBtn.textContent = 'Ⅱ';
  renderLeaderboard();
}
function die() {
  if (state !== 'playing') return;
  state = 'dead';
  deadFrame = frame;
  best = Math.max(best, score);
  shake = 10;
  spawnDeathBurst();

  const result = addScore(playerName, score);
  overlay.style.display = 'flex';
  nameEntry.style.display = 'none';
  leaderboardBox.style.display = 'block';
  titleText.textContent = '💥 GAME OVER';
  subText.textContent = result.madeTop10
    ? `Score: ${score} · 🎉 Top 10 rank #${result.rank + 1} · tap to retry`
    : `Score: ${score} · Best: ${best} · tap to retry`;
  renderLeaderboard(result.madeTop10 ? result.entry : null);
}
function flap() {
  if (state === 'ready') return tryStartGame();
  if (state === 'playing') {
    dog.vy = FLAP;
    spawnFlapParticles();
    return;
  }
  if (state === 'dead' && frame - deadFrame > 20) resetGame();
}
function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    pauseBtn.textContent = '▶';
    overlay.style.display = 'flex';
    nameEntry.style.display = 'none';
    leaderboardBox.style.display = 'none';
    titleText.textContent = '⏸ PAUSED';
    subText.textContent = 'Press the pause button again to keep flying.';
  } else if (state === 'paused') {
    state = 'playing';
    pauseBtn.textContent = 'Ⅱ';
    overlay.style.display = 'none';
  }
}

pauseBtn.addEventListener('click', e => { e.stopPropagation(); togglePause(); });
startBtn.addEventListener('click', e => { e.stopPropagation(); tryStartGame(); });
nameInput.addEventListener('click', e => e.stopPropagation());
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });
window.addEventListener('keydown', e => {
  if (document.activeElement === nameInput) {
    if (e.code === 'Enter') { e.preventDefault(); tryStartGame(); }
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); flap(); }
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
});

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1eaceb');
  g.addColorStop(.58, '#55c8ef');
  g.addColorStop(1, '#bcecf4');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}
function drawCloud(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.scale, c.scale);
  ctx.fillStyle = 'rgba(255,255,255,.82)';
  ctx.beginPath();
  ctx.arc(-20, 6, 16, 0, Math.PI * 2);
  ctx.arc(0, -2, 22, 0, Math.PI * 2);
  ctx.arc(23, 7, 17, 0, Math.PI * 2);
  ctx.arc(5, 12, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function drawHills() {
  ctx.fillStyle = 'rgba(91,182,139,.42)';
  hills.forEach(h => {
    ctx.beginPath();
    ctx.moveTo(h.x, H - groundHeight);
    ctx.quadraticCurveTo(h.x + h.w / 2, H - groundHeight - h.h, h.x + h.w, H - groundHeight);
    ctx.closePath();
    ctx.fill();
  });

  ctx.fillStyle = 'rgba(66,160,111,.42)';
  for (let x = -15; x < W + 30; x += 35) {
    ctx.beginPath();
    ctx.arc(x, H - groundHeight + 4, 24, Math.PI, 0);
    ctx.fill();
  }
}
function updateScenery(m) {
  const moving = state === 'playing';
  clouds.forEach(c => {
    c.x -= c.speed * (moving ? 1 : .25) * m;
    if (c.x < -60) { c.x = W + 65; c.y = 40 + Math.random() * 180; }
  });
  hills.forEach(h => {
    h.x -= BONE_SPEED * .13 * (moving ? 1 : .15) * m;
    if (h.x + h.w < -20) h.x += hills.length * 100;
  });
  if (moving) groundOffset += BONE_SPEED * m;
}
function boneGradient(x, width) {
  const g = ctx.createLinearGradient(x, 0, x + width, 0);
  g.addColorStop(0, '#f0d8a9');
  g.addColorStop(.18, '#fff5d5');
  g.addColorStop(.52, '#fff9e5');
  g.addColorStop(.82, '#e8c993');
  g.addColorStop(1, '#c99e68');
  return g;
}
function drawBoneCap(cx, cy, width) {
  const r = width * .24;
  const dx = width * .22;
  ctx.fillStyle = boneGradient(cx - width / 2, width);
  ctx.strokeStyle = '#724124';
  ctx.lineWidth = 2.5;

  ctx.beginPath();
  ctx.arc(cx - dx, cy, r, 0, Math.PI * 2);
  ctx.arc(cx + dx, cy, r, 0, Math.PI * 2);
  ctx.rect(cx - dx, cy - r, dx * 2, r * 2);
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = 'rgba(156,108,63,.25)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(cx - dx - 1, cy - 2, r * .45, .2, 2.5);
  ctx.stroke();
}
function drawBonePillar(x, y, height, capAtBottom) {
  if (height <= 0) return;
  const cx = x + BONE_WIDTH / 2;
  const shaftW = BONE_WIDTH * .72;
  const capOffset = BONE_WIDTH * .17;
  const capY = capAtBottom ? y + height - capOffset : y + capOffset;
  const shaftTop = capAtBottom ? y - 6 : capY;
  const shaftBottom = capAtBottom ? capY : y + height + 6;

  ctx.fillStyle = boneGradient(cx - shaftW / 2, shaftW);
  ctx.strokeStyle = '#724124';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.roundRect(cx - shaftW / 2, shaftTop, shaftW, shaftBottom - shaftTop, 15);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath();
  ctx.roundRect(cx - shaftW * .29, shaftTop + 8, 7, Math.max(8, shaftBottom - shaftTop - 16), 4);
  ctx.fill();

  drawBoneCap(cx, capY, BONE_WIDTH);
}
function drawObstacle(o) {
  drawBonePillar(o.x, -35, o.topH + 35, true);
  const bottomY = o.topH + BONE_GAP;
  drawBonePillar(o.x, bottomY, H - groundHeight - bottomY + 30, false);
}
function drawGround() {
  const gy = H - groundHeight;
  ctx.fillStyle = '#75ca37';
  ctx.fillRect(0, gy, W, 13);
  ctx.fillStyle = '#4fa928';
  ctx.fillRect(0, gy + 10, W, 5);

  const g = ctx.createLinearGradient(0, gy + 14, 0, H);
  g.addColorStop(0, '#a85c31');
  g.addColorStop(1, '#754024');
  ctx.fillStyle = g;
  ctx.fillRect(0, gy + 14, W, groundHeight - 14);

  ctx.fillStyle = 'rgba(255,226,176,.2)';
  for (let x = -30; x < W + 30; x += 43) {
    const px = ((x - groundOffset * .65) % (W + 43) + (W + 43)) % (W + 43) - 22;
    ctx.beginPath();
    ctx.ellipse(px, gy + 37 + (x % 3) * 8, 8, 4, -.15, 0, Math.PI * 2);
    ctx.fill();
  }
}
function drawDog() {
  ctx.save();
  ctx.translate(dog.x, dog.y);
  ctx.rotate(dog.rotation);

  const bob = Math.sin(dog.flapPhase) * 1.4;
  const w = 78;
  const h = 77;
  if (dogSprite.complete && dogSprite.naturalWidth) {
    ctx.shadowColor = 'rgba(22,55,72,.2)';
    ctx.shadowBlur = 5;
    ctx.shadowOffsetY = 3;
    ctx.drawImage(dogSprite, -w * .54, -h * .5 + bob, w, h);
  } else {
    ctx.font = '48px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐶', 0, 0);
  }
  ctx.restore();
}
function updateDog(m, dt) {
  if (state === 'playing') {
    dog.vy = Math.min(MAX_FALL, dog.vy + GRAVITY * m);
    dog.y += dog.vy * m;
    const target = Math.max(-.45, Math.min(1.05, dog.vy / 10));
    dog.rotation += (target - dog.rotation) * (1 - Math.pow(.8, m));

    if (dog.y - dog.radius < 0) {
      dog.y = dog.radius;
      dog.vy = 0;
    }
    if (dog.y + dog.radius > H - groundHeight) {
      dog.y = H - groundHeight - dog.radius;
      die();
    }
    dog.flapPhase += 25 * dt;
  } else if (state === 'ready') {
    dog.y = H / 2 + Math.sin(clockTime * 4.1) * 8;
    dog.rotation = Math.sin(clockTime * 4.1) * .05;
    dog.flapPhase += 8 * dt;
  } else if (state === 'dead') {
    if (dog.y + dog.radius < H - groundHeight) {
      dog.vy += GRAVITY * m;
      dog.y += dog.vy * m;
      dog.rotation = Math.min(1.35, dog.rotation + .045 * m);
    }
  }
}

let lastTime = performance.now();
function loop(now) {
  let dt = (now - lastTime) / 1000;
  if (dt > .05) dt = .05;
  lastTime = now;
  clockTime += dt;
  const m = dt * 60;
  frame += m;

  updateScenery(m);
  if (state !== 'paused') {
    updateDog(m, dt);
    if (state === 'playing') updateObstacles(m);
    updateParticles(m);
  }

  if (shake > 0) shake *= Math.pow(.84, m);
  if (shake < .4) shake = 0;

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  drawSky();
  clouds.forEach(drawCloud);
  drawHills();
  obstacles.forEach(drawObstacle);
  drawParticles();
  drawDog();
  drawGround();

  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
