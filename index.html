<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 400, H = 600; // logical game units (unchanged physics/layout)

// --- Responsive full-window canvas: internal resolution stays crisp (HiDPI),
//     CSS size scales to fit the browser window while keeping the 400x600 aspect ratio ---
function setupCanvas() {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;

  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H);
  canvas.style.width = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
setupCanvas();
window.addEventListener('resize', setupCanvas);
window.addEventListener('orientationchange', setupCanvas);

fullscreenBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen && document.documentElement.requestFullscreen())
      ?.catch(() => {});
  } else {
    document.exitFullscreen && document.exitFullscreen();
  }
});
document.addEventListener('fullscreenchange', () => {
  fullscreenBtn.textContent = document.fullscreenElement ? '✕' : '⛶';
  setupCanvas();
});

  authDomain: "first-app-7456b.firebaseapp.com",

  projectId: "first-app-7456b",

// ---------- Leaderboard (shared globally via Firebase Realtime Database) ----------
// firebaseConfig comes from firebase-config.js (shared across all games on this site).
// Until it's filled in, the game falls back to this browser's local storage only.
// Namespaced by game, so this SAME Firebase project can host other games'
// leaderboards too (each game just gets its own GAME_ID) without mixing scores.
const GAME_ID = 'flappy-dog';

const USE_FIREBASE = !!(typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY" && window.firebase);
let fbRef = null;
if (USE_FIREBASE) {
  firebase.initializeApp(firebaseConfig);
  fbRef = firebase.database().ref('leaderboards/' + GAME_ID);
}

const LB_KEY = 'leaderboard_' + GAME_ID;
const NAME_KEY = 'playerName'; // shared across all games on this site — enter your name once
let playerName = '';
let leaderboard = [];

function localLoad() {
  try {
    const raw = JSON.parse(localStorage.getItem(LB_KEY));
    return Array.isArray(raw) ? raw : [];
  } catch (e) { return []; }
}
function localSave(list) {
  try { localStorage.setItem(LB_KEY, JSON.stringify(list)); } catch (e) {}
}
if (USE_FIREBASE) {
  // Live-synced: every visitor sees the same top 10, updating in real time.
  fbRef.on('value', (snap) => {
    const arr = [];
    snap.forEach((child) => {
      const v = child.val() || {};
      arr.push({ key: child.key, name: v.name, score: v.score, date: v.date || 0 });
    });
    arr.sort((a, b) => b.score - a.score || a.date - b.date);
    leaderboard = arr.slice(0, 10);
    renderLeaderboard();
  });
} else {
  leaderboard = localLoad();
}

async function pruneFirebaseLeaderboard() {
  if (!fbRef) return;

  try {
    const snap = await fbRef.orderByChild('score').once('value');

    const items = [];

    snap.forEach((child) => {
      const value = child.val() || {};

      items.push({
        key: child.key,
        score: Number(value.score || 0),
        date: Number(value.date || 0)
      });
    });

    // Keep the 10 highest scores.
    // Sort ascending first so the lowest scores are removed.
    items.sort((a, b) => a.score - b.score || a.date - b.date);

    if (items.length <= 10) {
      console.log(`Firebase leaderboard: ${items.length} records, nothing to prune.`);
      return;
    }

    const toRemove = items.slice(0, items.length - 10);

    console.log(
      `Firebase leaderboard: ${items.length} records -> removing ${toRemove.length}`
    );

    await Promise.all(
      toRemove.map(({ key }) => fbRef.child(key).remove())
    );

    console.log('Firebase leaderboard pruned to 10 records.');
  } catch (err) {
    console.error('Firebase leaderboard prune failed:', err);
  }
}

function addScoreToLeaderboard(name, sc) {
  const entry = { name: name, score: sc, date: Date.now() };
  // rank computed against the currently cached top 10 (works before the async write resolves)
  let rank = leaderboard.findIndex((e) => sc > e.score);
  if (rank === -1) rank = leaderboard.length;
  const madeTop10 = rank < 10;

  if (USE_FIREBASE) {
    fbRef.push(entry)
      .then(() => pruneFirebaseLeaderboard())
      .catch((err) => {
        console.error('Firebase leaderboard write failed:', err);
      });
  } else {
    leaderboard.push(entry);
    leaderboard.sort((a, b) => b.score - a.score || a.date - b.date);
    leaderboard = leaderboard.slice(0, 10);
    localSave(leaderboard);
  }
  return { entry: entry, madeTop10: madeTop10, rank: rank };
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderLeaderboard(highlightEntry) {
  leaderboardList.innerHTML = '';
  if (leaderboard.length === 0) {
    const li = document.createElement('li');
    li.className = 'lbEmpty';
    li.textContent = 'No scores yet — be the first!';
    leaderboardList.appendChild(li);
    return;
  }
  leaderboard.forEach((entry, i) => {
    const li = document.createElement('li');
    const isHighlight = highlightEntry && entry.name === highlightEntry.name && entry.score === highlightEntry.score;
    li.className = 'lbRow' + (isHighlight ? ' lbHighlight' : '');
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
    li.innerHTML = '<span class="lbRank">' + medal + '</span>' +
      '<span class="lbName">' + escapeHtml(entry.name) + '</span>' +
      '<span class="lbScore">' + entry.score + '</span>';
    leaderboardList.appendChild(li);
  });
}

// prefill last-used name
nameInput.value = (() => { try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; } })();
renderLeaderboard();

}

// ---------- Game State ----------
let state = 'ready'; // ready, playing, dead
let frame = 0;
let score = 0;
let best = 0;

// ---------- Bird ----------
const bird = {
  x: 110,
  y: H / 2,
  vy: 0,
  radius: 14,
  rotation: 0,
  wingPhase: 0
};
const GRAVITY = 0.45;
const FLAP = -8.2;
const MAX_FALL = 10;

// ---------- Pipes ----------
let pipes = [];
const PIPE_GAP = 155;
const PIPE_WIDTH = 62;
const PIPE_SPEED = 2.6;
let pipeTimer = 0;
const PIPE_INTERVAL = 105;

// ---------- Background layers (parallax) ----------
let clouds = [];
for (let i = 0; i < 6; i++) {
  clouds.push({
    x: Math.random() * W,
    y: 40 + Math.random() * 160,
    scale: 0.6 + Math.random() * 0.9,
    speed: 0.2 + Math.random() * 0.3
  });
}

let hills = [];
for (let i = 0; i < 5; i++) {
  hills.push({ x: i * 140, w: 160 + Math.random()*40, h: 60 + Math.random()*40 });
}

const groundHeight = 90;
let groundOffset = 0;

// ---------- Particles (flap trail, death burst) ----------
let particles = [];

function spawnFlapParticles() {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: bird.x - 10,
      y: bird.y + 6,
      vx: -1.5 - Math.random()*1.5,
      vy: (Math.random()-0.5)*1.5,
      life: 24,
      maxLife: 24,
      size: 2 + Math.random()*2,
      color: 'rgba(255,255,255,0.8)'
    });
  }
}

function spawnDeathBurst() {
  for (let i = 0; i < 26; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x: bird.x,
      y: bird.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 40,
      maxLife: 40,
      size: 2 + Math.random()*3,
      color: ['#ffd93d','#ff6b6b','#ffffff'][Math.floor(Math.random()*3)]
    });
  }
}

function updateParticles(m) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * m;
    p.y += p.vy * m;
    p.vy += 0.05 * m;
    p.life -= m;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ---------- Screen shake ----------
let shake = 0;

// ---------- Input ----------
function flap() {
  if (state === 'ready') {
    tryStartGame();
    return;
  }
  if (state === 'playing') {
    bird.vy = FLAP;
    spawnFlapParticles();
  }
  if (state === 'dead') {
    // small delay to prevent accidental instant restart
    if (frame - deadFrame > 20) resetGame();
  }
}

function tryStartGame() {
  const name = nameInput.value.trim();
  if (!name) {
    nameInput.classList.remove('shakeError');
    void nameInput.offsetWidth; // restart animation
    nameInput.classList.add('shakeError');
    nameInput.focus();
    subText.textContent = 'Please enter your name to play!';
    return;
  }
  playerName = name.slice(0, 14);
  try { localStorage.setItem(NAME_KEY, playerName); } catch (e) {}
  startGame();
}

let deadFrame = 0;

window.addEventListener('keydown', (e) => {
  if (document.activeElement === nameInput) {
    if (e.code === 'Enter') { e.preventDefault(); tryStartGame(); }
    return; // let the player type normally, including Space
  }
  if (e.code === 'Space') { e.preventDefault(); flap(); }
});
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, {passive:false});
startBtn.addEventListener('click', (e) => { e.stopPropagation(); tryStartGame(); });
nameInput.addEventListener('click', (e) => e.stopPropagation());

function startGame() {
  state = 'playing';
  overlay.style.display = 'none';
  scoreDisplay.style.display = 'block';
}

function resetGame() {
  bird.y = H/2; bird.vy = 0; bird.rotation = 0;
  pipes = [];
  pipeTimer = 0;
  score = 0;
  particles = [];
  scoreDisplay.textContent = '0';
  state = 'ready';
  overlay.style.display = 'flex';
  titleText.textContent = '🐶 FLAPPY DOG';
  subText.textContent = 'Click, Tap, or press Space to flap';
  scoreDisplay.style.display = 'none';
  nameEntry.style.display = 'flex';
  leaderboardBox.style.display = 'block';
  renderLeaderboard();
}

function die() {
  if (state !== 'playing') return;
  state = 'dead';
  deadFrame = frame;
  spawnDeathBurst();
  shake = 12;
  best = Math.max(best, score);
  const result = addScoreToLeaderboard(playerName, score);
  overlay.style.display = 'flex';
  nameEntry.style.display = 'none';
  leaderboardBox.style.display = 'block';
  renderLeaderboard(result.madeTop10 ? result.entry : null);
  titleText.textContent = '💥 GAME OVER';
  subText.textContent = result.madeTop10
    ? `Score: ${score}  •  🎉 New Top 10! Rank #${result.rank + 1}  (tap to retry)`
    : `Score: ${score}   Best: ${best}   (tap to retry)`;
}

// ---------- Pipes logic ----------
function spawnPipe() {
  const margin = 60;
  const topH = margin + Math.random() * (H - groundHeight - PIPE_GAP - margin*2);
  pipes.push({
    x: W + 20,
    topH: topH,
    passed: false,
    hue: 100 + Math.random()*20
  });
}

function updatePipes(m) {
  pipeTimer += m;
  if (pipeTimer >= PIPE_INTERVAL) {
    pipeTimer = 0;
    spawnPipe();
  }
  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= PIPE_SPEED * m;

    // scoring
    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
      p.passed = true;
      score++;
      scoreDisplay.textContent = score;
      scoreDisplay.style.animation = 'none';
      void scoreDisplay.offsetWidth;
      scoreDisplay.style.transition = 'transform 0.15s';
      scoreDisplay.style.transform = 'translateX(-50%) scale(1.3)';
      setTimeout(()=> scoreDisplay.style.transform = 'translateX(-50%) scale(1)', 150);
    }

    // collision
    const bx = bird.x, by = bird.y, br = bird.radius * 0.75;
    if (bx + br > p.x && bx - br < p.x + PIPE_WIDTH) {
      if (by - br < p.topH || by + br > p.topH + PIPE_GAP) {
        die();
      }
    }

    if (p.x + PIPE_WIDTH < -20) pipes.splice(i, 1);
  }
}

// ---------- Draw functions ----------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4ec0e9');
  g.addColorStop(0.6, '#7fd4e8');
  g.addColorStop(1, '#bdeaf0');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawSun() {
  const sx = W - 70, sy = 70;
  const glow = ctx.createRadialGradient(sx, sy, 5, sx, sy, 55);
  glow.addColorStop(0, 'rgba(255,247,200,0.9)');
  glow.addColorStop(1, 'rgba(255,247,200,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sx, sy, 55, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff4c2';
  ctx.beginPath(); ctx.arc(sx, sy, 26, 0, Math.PI*2); ctx.fill();
}

function drawCloud(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.scale, c.scale);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(0, 0, 18, 0, Math.PI*2);
  ctx.arc(20, -8, 14, 0, Math.PI*2);
  ctx.arc(22, 6, 16, 0, Math.PI*2);
  ctx.arc(-18, 6, 14, 0, Math.PI*2);
  ctx.arc(2, 10, 18, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function updateClouds(m) {
  clouds.forEach(c => {
    c.x -= c.speed * (state === 'playing' ? 1 : 0.4) * m;
    if (c.x < -60) { c.x = W + 60; c.y = 30 + Math.random()*160; }
  });
}

function drawHills() {
  ctx.fillStyle = 'rgba(70,160,100,0.55)';
  hills.forEach(h => {
    ctx.beginPath();
    ctx.moveTo(h.x, H - groundHeight);
    ctx.quadraticCurveTo(h.x + h.w/2, H - groundHeight - h.h, h.x + h.w, H - groundHeight);
    ctx.closePath();
    ctx.fill();
  });
}

function updateHills(m) {
  hills.forEach(h => {
    h.x -= PIPE_SPEED * 0.25 * (state === 'playing' ? 1 : 0.3) * m;
    if (h.x + h.w < 0) h.x += hills.length * 140;
  });
}

function drawBone(x, y, width, height, flip = false) {
  ctx.save();
  ctx.translate(x, y);
  if (flip) {
    ctx.translate(0, height);
    ctx.scale(1, -1);
  }

  const shaftW = width * 0.48;
  const r = width * 0.25;
  const cx = width / 2;

  // Bone silhouette: two rounded ends connected by a thick shaft.
  ctx.beginPath();
  ctx.moveTo(cx - shaftW / 2, r);
  ctx.lineTo(cx - shaftW / 2, height - r);
  ctx.quadraticCurveTo(cx - shaftW / 2, height - r * 0.15, cx - r * 0.72, height - r * 0.08);
  ctx.quadraticCurveTo(cx - r * 0.18, height + r * 0.08, cx + r * 0.12, height - r * 0.02);
  ctx.quadraticCurveTo(cx + r * 0.48, height - r * 0.12, cx + shaftW / 2, height - r * 0.78);
  ctx.lineTo(cx + shaftW / 2, r * 0.8);
  ctx.quadraticCurveTo(cx + r * 0.48, r * 0.1, cx + r * 0.12, r * 0.02);
  ctx.quadraticCurveTo(cx - r * 0.18, -r * 0.08, cx - r * 0.72, r * 0.08);
  ctx.quadraticCurveTo(cx - shaftW / 2, r * 0.15, cx - shaftW / 2, r);
  ctx.closePath();

  const grad = ctx.createLinearGradient(0, 0, width, 0);
  grad.addColorStop(0, '#d9b879');
  grad.addColorStop(0.18, '#fff4cf');
  grad.addColorStop(0.5, '#fff9e7');
  grad.addColorStop(0.82, '#ead29a');
  grad.addColorStop(1, '#c59c5f');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = 'rgba(75, 45, 20, 0.35)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Bone highlight.
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(cx - shaftW * 0.18, r * 1.1);
  ctx.lineTo(cx - shaftW * 0.18, height - r * 1.15);
  ctx.stroke();

  ctx.restore();
}

function drawPipe(p) {
  const capH = 26;
  const boneWidth = PIPE_WIDTH + 10;

  // Top obstacle: bone hangs down from the ceiling.
  drawBone(p.x - 5, 0, boneWidth, p.topH, false);

  // Bottom obstacle: bone grows upward from the ground.
  const bottomY = p.topH + PIPE_GAP;
  drawBone(p.x - 5, bottomY, boneWidth, H - groundHeight - bottomY, false);
}

function drawGround() {
  const gy = H - groundHeight;
  const grad = ctx.createLinearGradient(0, gy, 0, H);
  grad.addColorStop(0, '#ded18f');
  grad.addColorStop(0.15, '#e6d9a0');
  grad.addColorStop(1, '#c8b877');
  ctx.fillStyle = grad;
  ctx.fillRect(0, gy, W, groundHeight);

  // grass top strip
  ctx.fillStyle = '#6fce5a';
  ctx.fillRect(0, gy, W, 10);
  ctx.fillStyle = '#5cb84a';
  ctx.fillRect(0, gy + 8, W, 4);

  // scrolling texture dashes
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 3;
  for (let x = -40; x < W + 40; x += 40) {
    const xi = ((x - groundOffset) % (W + 40) + (W+40)) % (W+40) - 40;
    ctx.beginPath();
    ctx.moveTo(xi, gy + 20);
    ctx.lineTo(xi + 20, gy + 20);
    ctx.stroke();
  }
}

function updateGround(m) {
  if (state === 'playing') groundOffset += PIPE_SPEED * m;
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);

  // Keep the original physics size, but render the supplied corgi artwork.
  const dogSize = 54;
  if (dogImage.complete && dogImage.naturalWidth > 0) {
    ctx.drawImage(dogImage, -dogSize / 2, -dogSize / 2, dogSize, dogSize);
  } else {
    // Tiny fallback while the image is loading.
    ctx.fillStyle = '#d9a35f';
    ctx.beginPath();
    ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function updateBird(m, dtClock) {
  if (state === 'playing') {
    bird.vy += GRAVITY * m;
    if (bird.vy > MAX_FALL) bird.vy = MAX_FALL;
    bird.y += bird.vy * m;

    // rotation based on velocity, framerate-independent easing
    const targetRot = Math.max(-0.5, Math.min(1.2, bird.vy / 10));
    const ease = 1 - Math.pow(1 - 0.2, m);
    bird.rotation += (targetRot - bird.rotation) * ease;

    if (bird.y - bird.radius < 0) { bird.y = bird.radius; bird.vy = 0; }
    if (bird.y + bird.radius > H - groundHeight) {
      bird.y = H - groundHeight - bird.radius;
      die();
    }
  } else if (state === 'ready') {
    bird.y = H/2 + Math.sin(clockTime * 4.2) * 8;
    bird.rotation = Math.sin(clockTime * 4.2) * 0.08;
  } else if (state === 'dead') {
    if (bird.y + bird.radius < H - groundHeight) {
      bird.vy += GRAVITY * m;
      bird.y += bird.vy * m;
      bird.rotation = Math.min(1.5, bird.rotation + 0.05 * m);
    }
  }
  bird.wingPhase += (state === 'playing' ? 30 : 9) * dtClock;
}

// ---------- Main loop (delta-time based for smooth, refresh-rate-independent motion) ----------
let lastTime = performance.now();
let clockTime = 0; // seconds, used for idle sine-wave motions

function loop(now) {
  // dt in seconds, clamped to avoid huge jumps after tab-switch/lag
  let dt = (now - lastTime) / 1000;
  if (dt > 0.05) dt = 0.05; // clamp to ~20fps min step
  lastTime = now;
  clockTime += dt;

  // m = "60fps-equivalent frames" this tick — keeps all existing tuning values
  // (which were designed at 60fps) correct at any actual refresh rate.
  const m = dt * 60;
  frame += m;

  updateClouds(m);
  updateHills(m);
  updateGround(m);
  updateBird(m, dt);
  if (state === 'playing') updatePipes(m);
  updateParticles(m);
  if (shake > 0) shake *= Math.pow(0.85, m);
  if (shake < 0.5) shake = 0;

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) {
    const dx = (Math.random()-0.5) * shake;
    const dy = (Math.random()-0.5) * shake;
    ctx.translate(dx, dy);
  }

  drawSky();
  drawSun();
  clouds.forEach(drawCloud);
  drawHills();
  pipes.forEach(drawPipe);
  drawParticles();
  drawBird();
  drawGround();

  ctx.restore();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
