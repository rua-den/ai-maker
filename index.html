<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Dog</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    height: 100%; width: 100%;
    background: #70c5ce;
    font-family: 'Segoe UI', system-ui, sans-serif;
    touch-action: manipulation;
  }
  #gameContainer {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #fullscreenBtn {
    position: fixed;
    top: 14px; right: 14px;
    z-index: 20;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.35);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(3px);
    transition: background 0.15s, transform 0.1s;
  }
  #fullscreenBtn:hover { background: rgba(0,0,0,0.55); }
  #fullscreenBtn:active { transform: scale(0.92); }
  canvas {
    display: block;
    box-shadow: 0 0 60px rgba(0,0,0,0.4);
    cursor: pointer;
    image-rendering: crisp-edges;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
    color: white;
    text-shadow: 0 3px 6px rgba(0,0,0,0.5);
  }
  #titleText {
    font-size: clamp(28px, 6vw, 46px);
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 6px;
    animation: floaty 2.2s ease-in-out infinite;
  }
  #subText {
    font-size: clamp(13px, 2.5vw, 17px);
    opacity: 0.92;
    font-weight: 500;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }
  #scoreDisplay {
    position: absolute;
    top: 24px; left: 50%; transform: translateX(-50%);
    font-size: 48px;
    font-weight: 900;
    color: white;
    text-shadow: 0 0 6px rgba(0,0,0,0.4), 3px 3px 0 rgba(0,0,0,0.25);
    -webkit-text-stroke: 2px rgba(0,0,0,0.15);
    pointer-events: none;
    display: none;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .panel {
    pointer-events: auto;
    background: rgba(20, 30, 40, 0.55);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }
  #nameEntry {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    align-items: center;
  }
  #nameInput {
    font-size: 16px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.4);
    outline: none;
    width: 150px;
    text-align: center;
    font-weight: 600;
    background: rgba(255,255,255,0.92);
    color: #2a2a2a;
    text-shadow: none;
    transition: border-color 0.15s, transform 0.1s;
  }
  #nameInput:focus { border-color: #ffd93d; }
  #nameInput.shakeError {
    border-color: #ff6b6b;
    animation: shakeX 0.4s;
  }
  @keyframes shakeX {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  #startBtn {
    font-size: 16px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(180deg, #ffe98a, #ffc93c);
    color: #5a3d00;
    cursor: pointer;
    text-shadow: none;
    box-shadow: 0 3px 0 #c99a1e;
    transition: transform 0.08s;
  }
  #startBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c99a1e; }
  #leaderboardBox {
    margin-top: 16px;
    min-width: 220px;
    max-width: 260px;
  }
  #lbTitle {
    font-size: 16px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  #leaderboardList {
    list-style: none;
    margin: 0; padding: 0;
    max-height: 190px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .lbRow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(255,255,255,0.08);
  }
  .lbRow.lbHighlight {
    background: rgba(255,217,61,0.35);
    box-shadow: 0 0 0 1px rgba(255,217,61,0.6) inset;
    animation: floaty 1.4s ease-in-out infinite;
  }
  .lbRank { width: 26px; flex-shrink: 0; text-align: center; }
  .lbName {
    flex: 1;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lbScore { flex-shrink: 0; opacity: 0.9; }
  .lbEmpty {
    text-align: center;
    font-size: 13px;
    opacity: 0.8;
    font-weight: 500;
    list-style: none;
    padding: 6px 0;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <button id="fullscreenBtn" title="Toggle Fullscreen">⛶</button>
  <canvas id="game" width="400" height="600"></canvas>
  <div id="scoreDisplay">0</div>
  <div id="overlay">
    <div id="titleText">🐶 FLAPPY DOG</div>
    <div id="subText">Click, Tap, or press Space to flap</div>
    <div id="nameEntry" class="panel">
      <input id="nameInput" type="text" maxlength="14" placeholder="Your name" autocomplete="off" />
      <button id="startBtn">▶ Play</button>
    </div>
    <div id="leaderboardBox" class="panel">
      <div id="lbTitle">🏆 Top 10</div>
      <ol id="leaderboardList"></ol>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 400, H = 600; // logical game units (unchanged physics/layout)

// --- Responsive full-window canvas: internal resolution stays crisp (HiDPI),
//     CSS size scales to fit the browser window while keeping the 400x600 aspect ratio ---
function setupCanvas() {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;

  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H);
  canvas.style.width = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
setupCanvas();
window.addEventListener('resize', setupCanvas);
window.addEventListener('orientationchange', setupCanvas);

const fullscreenBtn = document.getElementById('fullscreenBtn');
fullscreenBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen && document.documentElement.requestFullscreen())
      ?.catch(() => {});
  } else {
    document.exitFullscreen && document.exitFullscreen();
  }
});
document.addEventListener('fullscreenchange', () => {
  fullscreenBtn.textContent = document.fullscreenElement ? '✕' : '⛶';
  setupCanvas();
});

const overlay = document.getElementById('overlay');
const titleText = document.getElementById('titleText');
const subText = document.getElementById('subText');
const scoreDisplay = document.getElementById('scoreDisplay');
const nameEntry = document.getElementById('nameEntry');
const nameInput = document.getElementById('nameInput');
const startBtn = document.getElementById('startBtn');
const leaderboardBox = document.getElementById('leaderboardBox');
const leaderboardList = document.getElementById('leaderboardList');

// ---------- Leaderboard (persisted as JSON, top 10) ----------
const LB_KEY = 'flappyDogLeaderboard_v1';
const NAME_KEY = 'flappyDogPlayerName_v1';
let playerName = '';

function loadLeaderboard() {
  try {
    const raw = JSON.parse(localStorage.getItem(LB_KEY));
    return Array.isArray(raw) ? raw : [];
  } catch (e) { return []; }
}
function saveLeaderboard(list) {
  try { localStorage.setItem(LB_KEY, JSON.stringify(list)); } catch (e) {}
}
let leaderboard = loadLeaderboard();

function addScoreToLeaderboard(name, sc) {
  const entry = { name: name, score: sc, date: Date.now() };
  leaderboard.push(entry);
  leaderboard.sort((a, b) => b.score - a.score || a.date - b.date);
  leaderboard = leaderboard.slice(0, 10);
  saveLeaderboard(leaderboard);
  const rank = leaderboard.indexOf(entry);
  return { entry: entry, madeTop10: rank !== -1, rank: rank };
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderLeaderboard(highlightEntry) {
  leaderboardList.innerHTML = '';
  if (leaderboard.length === 0) {
    const li = document.createElement('li');
    li.className = 'lbEmpty';
    li.textContent = 'No scores yet — be the first!';
    leaderboardList.appendChild(li);
    return;
  }
  leaderboard.forEach((entry, i) => {
    const li = document.createElement('li');
    li.className = 'lbRow' + (highlightEntry === entry ? ' lbHighlight' : '');
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
    li.innerHTML = '<span class="lbRank">' + medal + '</span>' +
      '<span class="lbName">' + escapeHtml(entry.name) + '</span>' +
      '<span class="lbScore">' + entry.score + '</span>';
    leaderboardList.appendChild(li);
  });
}

// prefill last-used name
nameInput.value = (() => { try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; } })();
renderLeaderboard();

// ---------- Game State ----------
let state = 'ready'; // ready, playing, dead
let frame = 0;
let score = 0;
let best = 0;

// ---------- Bird ----------
const bird = {
  x: 110,
  y: H / 2,
  vy: 0,
  radius: 14,
  rotation: 0,
  wingPhase: 0
};
const GRAVITY = 0.45;
const FLAP = -8.2;
const MAX_FALL = 10;

// ---------- Pipes ----------
let pipes = [];
const PIPE_GAP = 155;
const PIPE_WIDTH = 62;
const PIPE_SPEED = 2.6;
let pipeTimer = 0;
const PIPE_INTERVAL = 105;

// ---------- Background layers (parallax) ----------
let clouds = [];
for (let i = 0; i < 6; i++) {
  clouds.push({
    x: Math.random() * W,
    y: 40 + Math.random() * 160,
    scale: 0.6 + Math.random() * 0.9,
    speed: 0.2 + Math.random() * 0.3
  });
}

let hills = [];
for (let i = 0; i < 5; i++) {
  hills.push({ x: i * 140, w: 160 + Math.random()*40, h: 60 + Math.random()*40 });
}

const groundHeight = 90;
let groundOffset = 0;

// ---------- Particles (flap trail, death burst) ----------
let particles = [];

function spawnFlapParticles() {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: bird.x - 10,
      y: bird.y + 6,
      vx: -1.5 - Math.random()*1.5,
      vy: (Math.random()-0.5)*1.5,
      life: 24,
      maxLife: 24,
      size: 2 + Math.random()*2,
      color: 'rgba(255,255,255,0.8)'
    });
  }
}

function spawnDeathBurst() {
  for (let i = 0; i < 26; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x: bird.x,
      y: bird.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 40,
      maxLife: 40,
      size: 2 + Math.random()*3,
      color: ['#ffd93d','#ff6b6b','#ffffff'][Math.floor(Math.random()*3)]
    });
  }
}

function updateParticles(m) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * m;
    p.y += p.vy * m;
    p.vy += 0.05 * m;
    p.life -= m;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ---------- Screen shake ----------
let shake = 0;

// ---------- Input ----------
function flap() {
  if (state === 'ready') {
    tryStartGame();
    return;
  }
  if (state === 'playing') {
    bird.vy = FLAP;
    spawnFlapParticles();
  }
  if (state === 'dead') {
    // small delay to prevent accidental instant restart
    if (frame - deadFrame > 20) resetGame();
  }
}

function tryStartGame() {
  const name = nameInput.value.trim();
  if (!name) {
    nameInput.classList.remove('shakeError');
    void nameInput.offsetWidth; // restart animation
    nameInput.classList.add('shakeError');
    nameInput.focus();
    subText.textContent = 'Please enter your name to play!';
    return;
  }
  playerName = name.slice(0, 14);
  try { localStorage.setItem(NAME_KEY, playerName); } catch (e) {}
  startGame();
}

let deadFrame = 0;

window.addEventListener('keydown', (e) => {
  if (document.activeElement === nameInput) {
    if (e.code === 'Enter') { e.preventDefault(); tryStartGame(); }
    return; // let the player type normally, including Space
  }
  if (e.code === 'Space') { e.preventDefault(); flap(); }
});
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, {passive:false});
startBtn.addEventListener('click', (e) => { e.stopPropagation(); tryStartGame(); });
nameInput.addEventListener('click', (e) => e.stopPropagation());

function startGame() {
  state = 'playing';
  overlay.style.display = 'none';
  scoreDisplay.style.display = 'block';
}

function resetGame() {
  bird.y = H/2; bird.vy = 0; bird.rotation = 0;
  pipes = [];
  pipeTimer = 0;
  score = 0;
  particles = [];
  scoreDisplay.textContent = '0';
  state = 'ready';
  overlay.style.display = 'flex';
  titleText.textContent = '🐶 FLAPPY DOG';
  subText.textContent = 'Click, Tap, or press Space to flap';
  scoreDisplay.style.display = 'none';
  nameEntry.style.display = 'flex';
  leaderboardBox.style.display = 'block';
  renderLeaderboard();
}

function die() {
  if (state !== 'playing') return;
  state = 'dead';
  deadFrame = frame;
  spawnDeathBurst();
  shake = 12;
  best = Math.max(best, score);
  const result = addScoreToLeaderboard(playerName, score);
  overlay.style.display = 'flex';
  nameEntry.style.display = 'none';
  leaderboardBox.style.display = 'block';
  renderLeaderboard(result.madeTop10 ? result.entry : null);
  titleText.textContent = '💥 GAME OVER';
  subText.textContent = result.madeTop10
    ? `Score: ${score}  •  🎉 New Top 10! Rank #${result.rank + 1}  (tap to retry)`
    : `Score: ${score}   Best: ${best}   (tap to retry)`;
}

// ---------- Pipes logic ----------
function spawnPipe() {
  const margin = 60;
  const topH = margin + Math.random() * (H - groundHeight - PIPE_GAP - margin*2);
  pipes.push({
    x: W + 20,
    topH: topH,
    passed: false,
    hue: 100 + Math.random()*20
  });
}

function updatePipes(m) {
  pipeTimer += m;
  if (pipeTimer >= PIPE_INTERVAL) {
    pipeTimer = 0;
    spawnPipe();
  }
  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= PIPE_SPEED * m;

    // scoring
    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
      p.passed = true;
      score++;
      scoreDisplay.textContent = score;
      scoreDisplay.style.animation = 'none';
      void scoreDisplay.offsetWidth;
      scoreDisplay.style.transition = 'transform 0.15s';
      scoreDisplay.style.transform = 'translateX(-50%) scale(1.3)';
      setTimeout(()=> scoreDisplay.style.transform = 'translateX(-50%) scale(1)', 150);
    }

    // collision
    const bx = bird.x, by = bird.y, br = bird.radius * 0.75;
    if (bx + br > p.x && bx - br < p.x + PIPE_WIDTH) {
      if (by - br < p.topH || by + br > p.topH + PIPE_GAP) {
        die();
      }
    }

    if (p.x + PIPE_WIDTH < -20) pipes.splice(i, 1);
  }
}

// ---------- Draw functions ----------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4ec0e9');
  g.addColorStop(0.6, '#7fd4e8');
  g.addColorStop(1, '#bdeaf0');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawSun() {
  const sx = W - 70, sy = 70;
  const glow = ctx.createRadialGradient(sx, sy, 5, sx, sy, 55);
  glow.addColorStop(0, 'rgba(255,247,200,0.9)');
  glow.addColorStop(1, 'rgba(255,247,200,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sx, sy, 55, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff4c2';
  ctx.beginPath(); ctx.arc(sx, sy, 26, 0, Math.PI*2); ctx.fill();
}

function drawCloud(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.scale, c.scale);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(0, 0, 18, 0, Math.PI*2);
  ctx.arc(20, -8, 14, 0, Math.PI*2);
  ctx.arc(22, 6, 16, 0, Math.PI*2);
  ctx.arc(-18, 6, 14, 0, Math.PI*2);
  ctx.arc(2, 10, 18, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function updateClouds(m) {
  clouds.forEach(c => {
    c.x -= c.speed * (state === 'playing' ? 1 : 0.4) * m;
    if (c.x < -60) { c.x = W + 60; c.y = 30 + Math.random()*160; }
  });
}

function drawHills() {
  ctx.fillStyle = 'rgba(70,160,100,0.55)';
  hills.forEach(h => {
    ctx.beginPath();
    ctx.moveTo(h.x, H - groundHeight);
    ctx.quadraticCurveTo(h.x + h.w/2, H - groundHeight - h.h, h.x + h.w, H - groundHeight);
    ctx.closePath();
    ctx.fill();
  });
}

function updateHills(m) {
  hills.forEach(h => {
    h.x -= PIPE_SPEED * 0.25 * (state === 'playing' ? 1 : 0.3) * m;
    if (h.x + h.w < 0) h.x += hills.length * 140;
  });
}

function drawPipe(p) {
  const capH = 26;
  const grad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_WIDTH, 0);
  grad.addColorStop(0, '#5fd15a');
  grad.addColorStop(0.15, '#7ee878');
  grad.addColorStop(0.5, '#4bb849');
  grad.addColorStop(1, '#3a9a3a');

  // top pipe
  ctx.fillStyle = grad;
  ctx.fillRect(p.x, 0, PIPE_WIDTH, p.topH - capH);
  ctx.fillRect(p.x - 4, p.topH - capH, PIPE_WIDTH + 8, capH);

  // bottom pipe
  const bottomY = p.topH + PIPE_GAP;
  ctx.fillRect(p.x, bottomY + capH, PIPE_WIDTH, H - groundHeight - (bottomY + capH));
  ctx.fillRect(p.x - 4, bottomY, PIPE_WIDTH + 8, capH);

  // highlight strip
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(p.x + 6, 0, 8, p.topH - capH);
  ctx.fillRect(p.x + 6, bottomY + capH, 8, H - groundHeight - (bottomY + capH));

  // shading edge
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(p.x + PIPE_WIDTH - 6, 0, 6, p.topH - capH);
  ctx.fillRect(p.x + PIPE_WIDTH - 6, bottomY + capH, 6, H - groundHeight - (bottomY + capH));
}

function drawGround() {
  const gy = H - groundHeight;
  const grad = ctx.createLinearGradient(0, gy, 0, H);
  grad.addColorStop(0, '#ded18f');
  grad.addColorStop(0.15, '#e6d9a0');
  grad.addColorStop(1, '#c8b877');
  ctx.fillStyle = grad;
  ctx.fillRect(0, gy, W, groundHeight);

  // grass top strip
  ctx.fillStyle = '#6fce5a';
  ctx.fillRect(0, gy, W, 10);
  ctx.fillStyle = '#5cb84a';
  ctx.fillRect(0, gy + 8, W, 4);

  // scrolling texture dashes
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 3;
  for (let x = -40; x < W + 40; x += 40) {
    const xi = ((x - groundOffset) % (W + 40) + (W+40)) % (W+40) - 40;
    ctx.beginPath();
    ctx.moveTo(xi, gy + 20);
    ctx.lineTo(xi + 20, gy + 20);
    ctx.stroke();
  }
}

function updateGround(m) {
  if (state === 'playing') groundOffset += PIPE_SPEED * m;
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);

  // ear flap / leg paddle animation
  const flap = Math.sin(bird.wingPhase) * 6;
  const legSwing = Math.sin(bird.wingPhase) * 8;

  // back leg (paddling, behind body)
  ctx.fillStyle = '#c98a4b';
  ctx.beginPath();
  ctx.ellipse(-4, 9 + legSwing*0.15, 4.5, 3, 0.6, 0, Math.PI*2);
  ctx.fill();

  // tail (wagging)
  ctx.strokeStyle = '#c98a4b';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-13, -1);
  ctx.quadraticCurveTo(-21, -8 + flap*0.6, -19, -14 - flap*0.3);
  ctx.stroke();

  // back ear (behind head, flapping)
  ctx.fillStyle = '#a9672f';
  ctx.beginPath();
  ctx.ellipse(6, -7 + flap*0.4, 5, 8, -0.5, 0, Math.PI*2);
  ctx.fill();

  // body
  const bodyGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, 16);
  bodyGrad.addColorStop(0, '#f2c891');
  bodyGrad.addColorStop(1, '#d9a35f');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 1, 14, 11, 0, 0, Math.PI*2);
  ctx.fill();

  // front leg (paddling)
  ctx.fillStyle = '#e0b174';
  ctx.beginPath();
  ctx.ellipse(2, 10 - legSwing*0.15, 4.5, 3, -0.5, 0, Math.PI*2);
  ctx.fill();

  // front ear (flapping opposite phase)
  ctx.fillStyle = '#c98a4b';
  ctx.beginPath();
  ctx.ellipse(11, -5 - flap*0.4, 5, 9, 0.5, 0, Math.PI*2);
  ctx.fill();

  // snout
  ctx.fillStyle = '#f2c891';
  ctx.beginPath();
  ctx.ellipse(13, 3, 7, 5.5, 0, 0, Math.PI*2);
  ctx.fill();

  // nose
  ctx.fillStyle = '#3a2a1e';
  ctx.beginPath();
  ctx.ellipse(19, 1.5, 2.6, 2.1, 0.2, 0, Math.PI*2);
  ctx.fill();

  // mouth line
  ctx.strokeStyle = '#8a5a2e';
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(19, 4);
  ctx.quadraticCurveTo(15, 8, 10, 6);
  ctx.stroke();

  // eye white
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(7, -3, 4.2, 0, Math.PI*2);
  ctx.fill();
  // pupil
  ctx.fillStyle = '#2b2b2b';
  ctx.beginPath();
  ctx.arc(8.3, -3, 2.3, 0, Math.PI*2);
  ctx.fill();
  // eye glint
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(9, -4, 0.8, 0, Math.PI*2);
  ctx.fill();

  // brown patch over one eye
  ctx.fillStyle = 'rgba(169,103,47,0.55)';
  ctx.beginPath();
  ctx.ellipse(3, -6, 5, 5.5, -0.3, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function updateBird(m, dtClock) {
  if (state === 'playing') {
    bird.vy += GRAVITY * m;
    if (bird.vy > MAX_FALL) bird.vy = MAX_FALL;
    bird.y += bird.vy * m;

    // rotation based on velocity, framerate-independent easing
    const targetRot = Math.max(-0.5, Math.min(1.2, bird.vy / 10));
    const ease = 1 - Math.pow(1 - 0.2, m);
    bird.rotation += (targetRot - bird.rotation) * ease;

    if (bird.y - bird.radius < 0) { bird.y = bird.radius; bird.vy = 0; }
    if (bird.y + bird.radius > H - groundHeight) {
      bird.y = H - groundHeight - bird.radius;
      die();
    }
  } else if (state === 'ready') {
    bird.y = H/2 + Math.sin(clockTime * 4.2) * 8;
    bird.rotation = Math.sin(clockTime * 4.2) * 0.08;
  } else if (state === 'dead') {
    if (bird.y + bird.radius < H - groundHeight) {
      bird.vy += GRAVITY * m;
      bird.y += bird.vy * m;
      bird.rotation = Math.min(1.5, bird.rotation + 0.05 * m);
    }
  }
  bird.wingPhase += (state === 'playing' ? 30 : 9) * dtClock;
}

// ---------- Main loop (delta-time based for smooth, refresh-rate-independent motion) ----------
let lastTime = performance.now();
let clockTime = 0; // seconds, used for idle sine-wave motions

function loop(now) {
  // dt in seconds, clamped to avoid huge jumps after tab-switch/lag
  let dt = (now - lastTime) / 1000;
  if (dt > 0.05) dt = 0.05; // clamp to ~20fps min step
  lastTime = now;
  clockTime += dt;

  // m = "60fps-equivalent frames" this tick — keeps all existing tuning values
  // (which were designed at 60fps) correct at any actual refresh rate.
  const m = dt * 60;
  frame += m;

  updateClouds(m);
  updateHills(m);
  updateGround(m);
  updateBird(m, dt);
  if (state === 'playing') updatePipes(m);
  updateParticles(m);
  if (shake > 0) shake *= Math.pow(0.85, m);
  if (shake < 0.5) shake = 0;

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) {
    const dx = (Math.random()-0.5) * shake;
    const dy = (Math.random()-0.5) * shake;
    ctx.translate(dx, dy);
  }

  drawSky();
  drawSun();
  clouds.forEach(drawCloud);
  drawHills();
  pipes.forEach(drawPipe);
  drawParticles();
  drawBird();
  drawGround();

  ctx.restore();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
