name: Render Bùm Chíu Assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    if: contains(github.event.head_commit.message, '[render-boom-assets]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/render-boom-chiu-assets.mjs
      - name: Commit rendered sprites
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/boom-chiu/styloo/ak47-fps.png assets/boom-chiu/quaternius/soldier-*.png
          git diff --cached --quiet || git commit -m "assets: rerender cropped Bùm Chíu viewmodels"
          git push
