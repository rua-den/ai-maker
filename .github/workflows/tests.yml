name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize app fonts once
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[normalize-fonts]')
        run: |
          node scripts/normalize-app-fonts.mjs --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "fix: apply Vietnamese-safe fonts across app"
            git push
          fi
      - run: node scripts/normalize-app-fonts.mjs --check
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
