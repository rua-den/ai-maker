name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

  vendor-onnxruntime:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[vendor-ort]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned ONNX Runtime Web
        run: npm install --no-save --ignore-scripts onnxruntime-web@1.28.0
      - name: Vendor same-origin runtime assets
        run: |
          set -euxo pipefail
          SRC=node_modules/onnxruntime-web/dist
          DEST=games/go-ai/vendor/ort
          mkdir -p "$DEST"
          cp "$SRC/ort.min.js" "$DEST/ort.min.js"
          cp "$SRC/ort-wasm-simd-threaded.mjs" "$DEST/ort-wasm-simd-threaded.mjs"
          cp "$SRC/ort-wasm-simd-threaded.wasm" "$DEST/ort-wasm-simd-threaded.wasm"
          printf 'onnxruntime-web 1.28.0\n' > "$DEST/VERSION"
          sha256sum "$DEST/ort.min.js" "$DEST/ort-wasm-simd-threaded.mjs" "$DEST/ort-wasm-simd-threaded.wasm" > "$DEST/SHA256SUMS"
          ls -lh "$DEST"
      - name: Commit vendored runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/go-ai/vendor/ort
          git commit -m 'chore: vendor ONNX Runtime Web 1.28.0'
          git push origin HEAD:main
