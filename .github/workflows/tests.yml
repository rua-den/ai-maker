name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  vendor-ort-wasm:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[vendor-ort-wasm]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch pinned ONNX Runtime Web package
        run: |
          set -euxo pipefail
          PKG=$(npm pack onnxruntime-web@1.29.0 --silent)
          mkdir -p /tmp/ortpkg
          tar -xzf "$PKG" -C /tmp/ortpkg
      - name: Vendor WASM-only runtime bundle
        run: |
          set -euxo pipefail
          SRC=/tmp/ortpkg/package/dist
          DEST=games/go-ai/vendor/ort
          cp "$SRC/ort.wasm.min.js" "$DEST/ort.wasm.min.js"
          printf 'onnxruntime-web 1.29.0\n' > "$DEST/VERSION"
          sha256sum \
            "$DEST/ort.wasm.min.js" \
            "$DEST/ort-wasm-simd-threaded.mjs" \
            "$DEST/ort-wasm-simd-threaded.wasm" > "$DEST/SHA256SUMS"
          ls -lh "$DEST"
      - name: Commit WASM-only runtime bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/go-ai/vendor/ort
          git commit -m 'chore: vendor ORT Web wasm-only bundle'
          git push origin HEAD:main
