name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/normalize-app-fonts.mjs --check
      - run: npm install --no-audit --no-fund
      - name: Smoke public Bùm Chíu health endpoint
        run: curl --fail --show-error --silent --retry 8 --retry-delay 10 --retry-all-errors --max-time 120 https://boom-chiu-pvp.onrender.com/health
      - name: Smoke public Bùm Chíu WebSocket room creation
        run: |
          node --input-type=module <<'NODE'
          import WebSocket from 'ws';
          const url='wss://boom-chiu-pvp.onrender.com';
          const ws=new WebSocket(url);
          const timer=setTimeout(()=>{console.error('Timed out waiting for public PvP server');ws.terminate();process.exit(1)},120000);
          ws.on('open',()=>ws.send(JSON.stringify({type:'create',name:'CI Render Smoke',map:'cat_chay',difficulty:'easy',targetScore:20})));
          ws.on('message',raw=>{
            const msg=JSON.parse(String(raw));
            if(msg.type==='error'){console.error(msg);clearTimeout(timer);ws.close();process.exit(1)}
            if(msg.type==='joined'){
              if(!/^[A-Z0-9]{6}$/.test(msg.room)){console.error('Bad room code',msg);process.exit(1)}
              console.log(`Public Render WebSocket OK, room ${msg.room}`);
              clearTimeout(timer);ws.close();
            }
          });
          ws.on('close',()=>process.exit(0));
          ws.on('error',err=>{console.error(err);clearTimeout(timer);process.exit(1)});
          NODE
      - run: npx playwright install --with-deps chromium
      - run: npm test
