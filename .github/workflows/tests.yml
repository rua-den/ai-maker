name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

  build-katago-model:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[katago-model]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout KataGo v1.18.2 source
        uses: actions/checkout@v4
        with:
          repository: lightvector/KataGo
          ref: fd0723fdbc0e9d82cf269c9630af8c27c57c07c4
          path: katago-src
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build protobuf-compiler libprotobuf-dev zlib1g-dev
      - name: Fetch ONNX Runtime CPU
        run: |
          mkdir -p deps/ort
          curl -fsSL --retry 3 https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-linux-x64-1.28.0.tgz -o /tmp/ort.tgz
          tar -xzf /tmp/ort.tgz -C deps/ort --strip-components=1
      - name: Build KataGo ONNX backend
        run: |
          cmake -S katago-src/cpp -B katago-src/cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DUSE_BACKEND=ONNX \
            -DONNXRUNTIME_ROOT="$GITHUB_WORKSPACE/deps/ort"
          cmake --build katago-src/cpp/build --target katago
      - name: Export official g170 b6c96 ONNX models
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/deps/ort/lib
        run: |
          mkdir -p generated-katago-model /tmp/katago-verify
          MODEL=katago-src/cpp/tests/models/g170-b6c96-s175395328-d26788732.bin.gz
          KATAGO=katago-src/cpp/build/katago
          "$KATAGO" dumponnx -model "$MODEL" \
            -out generated-katago-model/katago-b6c96.onnx \
            -nn-x-len 19 -nn-y-len 19
          "$KATAGO" dumponnx -model "$MODEL" \
            -out /tmp/katago-verify/katago-b6c96-13x13.onnx \
            -nn-x-len 13 -nn-y-len 13
          (cd generated-katago-model && sha256sum katago-b6c96.onnx > katago-b6c96.onnx.sha256)
          ls -lh generated-katago-model /tmp/katago-verify/katago-b6c96-13x13.onnx
      - name: Verify ONNX exactly reproduces source network at 13x13
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/deps/ort/lib
        run: |
          KATAGO=katago-src/cpp/build/katago
          BINGZ=katago-src/cpp/tests/models/g170-b6c96-s175395328-d26788732.bin.gz
          ONNX13=/tmp/katago-verify/katago-b6c96-13x13.onnx
          "$KATAGO" runnnsymmetriestest "$BINGZ" false false false > /tmp/katago-verify/source.txt
          "$KATAGO" runnnsymmetriestest "$ONNX13" false false false > /tmp/katago-verify/onnx.txt
          diff -u /tmp/katago-verify/source.txt /tmp/katago-verify/onnx.txt
          echo 'Verified: dumped 13x13 ONNX exactly reproduces official g170 evaluations.'
      - name: Smoke-test shipped 19x19 model
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/deps/ort/lib
        run: |
          KATAGO=katago-src/cpp/build/katago
          MODEL=generated-katago-model/katago-b6c96.onnx
          cp katago-src/cpp/configs/gtp_example.cfg /tmp/katago-19x19.cfg
          printf '\nonnxProvider = cpu\nmaxBoardSizeForNNBuffer = 19\nmaxVisits = 1\nnumSearchThreads = 1\n' >> /tmp/katago-19x19.cfg
          printf 'boardsize 19\nclear_board\ngenmove b\nquit\n' | \
            "$KATAGO" gtp -model "$MODEL" -config /tmp/katago-19x19.cfg | tee /tmp/katago-verify/gtp.txt
          grep -Eq '^= ([A-T][0-9]+|pass)$' /tmp/katago-verify/gtp.txt
          echo 'Verified: shipped 19x19 ONNX loads and performs a real neural inference.'
      - name: Upload verified model
        uses: actions/upload-artifact@v4
        with:
          name: katago-b6c96-onnx-verified
          path: generated-katago-model/
          if-no-files-found: error
          retention-days: 30
      - name: Commit verified model to the game
        run: |
          mkdir -p games/go-ai/models
          cp generated-katago-model/katago-b6c96.onnx games/go-ai/models/katago-b6c96.onnx
          cp generated-katago-model/katago-b6c96.onnx.sha256 games/go-ai/models/katago-b6c96.onnx.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/go-ai/models/katago-b6c96.onnx games/go-ai/models/katago-b6c96.onnx.sha256
          if git diff --cached --quiet; then
            echo 'Verified model is already committed.'
          else
            git commit -m 'feat: ship verified KataGo ONNX model'
            git push origin HEAD:main
          fi
